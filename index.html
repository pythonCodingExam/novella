/* NOVELLA / THE READING ROOM · editorial interface system
   Paper, ink, one indigo accent, quiet rules. No gradient-heavy UI. */
:root {
 --paper:#f8f6f2; --canvas:#fbfaf7; --white:#ffffff; --ink:#26252b;
 --sub:#56535f; --muted:#77737b; --line:#e0dcd7; --line-strong:#cbc4bd;
 --lav:#e8e4f3; --purple:#584d83; --purple-ink:#453b70;
 --blue:#e8eff3; --accent:#b8d5e3; --copper:#986444;
 --display:'Newsreader',Georgia,serif; --body:'DM Sans',Arial,sans-serif;
 --mono:'IBM Plex Mono',ui-monospace,monospace;
 --shadow:0 14px 35px rgba(29,26,38,.055);
}
* {box-sizing:border-box}
html{scroll-behavior:smooth}
body {margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea {font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[role=button]:focus-visible{outline:2px solid #786cb0;outline-offset:3px}
button:disabled{cursor:not-allowed;opacity:.6}
.shell{display:flex;min-height:100vh;max-width:2000px;margin:0 auto}
.sidebar {position:sticky;top:0;flex:0 0 238px;height:100vh;display:flex;flex-direction:column;
 background:#f6f3ef;border-right:1px solid var(--line);padding:27px 18px 20px;z-index:50}
.brand{font:500 33px/1 var(--display);letter-spacing:-1.5px;display:flex;align-items:center;gap:8px;padding:2px 8px 0; margin:0 0 55px;color:var(--ink)}
.brand-icon {border:1px solid var(--ink);width:29px;height:32px;display:grid;place-items:center;border-radius:50% 50% 3px 3px;font:500 21px var(--display);letter-spacing:0;transform:rotate(-7deg)}
.brand-dot{color:var(--purple)}
.side-label{font:500 10px/1.4 var(--mono);letter-spacing:1.3px;color:#726e76;padding:0 9px;margin:0 0 12px}
.sidebar nav{display:grid;gap:2px}
.sidebar nav button{position:relative;border:0;background:transparent;text-align:left;display:flex;align-items:center;gap:10px;
 padding:11px 9px;color:#68636a;font:500 13px var(--body);border-radius:0;min-height:42px}
.sidebar nav button span{line-height:1.25}
.sidebar nav button:hover{color:var(--purple);background:#ede9e3}
.sidebar nav button.active{color:var(--purple-ink);font-weight:700;background:transparent}
.sidebar nav button.active:before{content:'';position:absolute;left:-18px;top:8px;bottom:8px;width:3px;background:var(--purple)}
.genres-label{margin-top:35px;padding-top:20px;border-top:1px solid var(--line)}
.sidebar nav[aria-label="Quick genres"] button{padding-block:9px;font-size:12px;color:#6f6b72;min-height:36px}
.sidebar-bottom{margin-top:auto}
.sidebar-tip{border:1px solid #dbd3c8;background:#f0eae3;padding:16px 15px 14px;margin:18px 0 20px;position:relative}
.sidebar-tip:before{content:'“';display:block;font:40px/.6 var(--display);color:#9d8f7d}

/* NOVELLA V5 / A quiet literary magazine, not a dashboard */
:root{--paper:#f6f3ee;--canvas:#faf8f4;--ink:#202b35;--sub:#54616a;--muted:#68737a;--line:#dadbd8;--line-strong:#c4c9c9;--purple:#4b587c;--purple-ink:#2c4363;--lav:#e4e4f1;--accent:#bed8df;--display:'Newsreader',Georgia,serif;--body:'DM Sans',Arial,sans-serif}
body{background:var(--paper);font-size:14px}
.shell{display:block;max-width:none}

/* NOVELLA V6 / refined reader, motion, touch targets and accessible controls */
:root{--canvas:#fbf9f5;--paper:#f4f1eb;--ink:#202933;--line:#d9d6d0;--purple:#536985;--purple-ink:#284660}
body{letter-spacing:.005em}
.sidebar{box-shadow:0 1px 0 rgba(25,30,36,.035)}
.brand{font-weight:500}
.sidebar nav button{transition:color .18s,border-color .18s}
.topbar{padding-block:15px}
.search-wrap input{border-radius:5px;transition:border .18s,box-shadow .18s}
.search-wrap input:focus{border-color:#587493;box-shadow:0 0 0 3px #617e9930}
.auth-button,.primary-btn,.secondary-btn,.reading-shortcut{transition:background .18s,border-color .18s,transform .18s;min-height:41px}
.primary-btn:hover,.secondary-btn:hover,.reading-shortcut:hover{transform:translateY(-1px)}
.reading-shortcut{border:1px solid #b3bdc3;background:transparent;border-radius:3px;padding:10px 14px;font-weight:650;font-size:12px;white-space:nowrap;color:#384f61}
.hero{min-height:465px;background:#e4edf0;border-radius:5px;overflow:hidden}
.hero h1{line-height:.99;letter-spacing:-3px}
.hero-art{background:#dfdeea}
.book-cover{border-radius:2px;background:#e2e4e2}
.book-card-wrap{transition:transform .15s}
.book-card-wrap:focus-within{outline:2px solid #7286a0;outline-offset:5px}
.book-card h3{font-size:13.5px;line-height:1.45}
.empty{border:1px solid var(--line);background:var(--canvas);padding:40px 30px}
.modal{border-radius:7px;background:#fcfaf7;color:#24313c;width:min(100%,485px);box-shadow:0 35px 90px #10182055}
.modal h2{font-size:clamp(34px,5vw,45px);color:#273542}
.modal .field label{display:block;font-size:12px;font-weight:650;margin-bottom:8px;color:#3d4a53}
.modal .field input,.modal .field textarea{background:#fff!important;color:#273542!important;border:1px solid #bcc8cf;border-radius:4px;padding:12px 13px;outline:0;min-height:46px}
.modal .field input:focus{border-color:#526d93;box-shadow:0 0 0 3px #8da4bb44}
.google-auth{display:flex;gap:12px;align-items:center;justify-content:center;width:100%;margin:18px 0 12px;border:1px solid #aab8c2;border-radius:4px;background:#fff;color:#27343c;font-weight:700;padding:12px 16px;min-height:48px}
.google-auth:hover{background:#f2f5f9;border-color:#6986a7}
.google-symbol{display:inline-grid;place-items:center;color:#4285f4;font:bold 21px Arial,sans-serif}
.modal .auth-tabs{gap:12px}
.modal .auth-tabs button{padding:12px 14px;font-size:13px}
.modal .form-msg{min-height:1em;overflow-wrap:anywhere}
body.dark-mode .modal{background:#282f35;color:#f7f4ed}
body.dark-mode .modal h2,body.dark-mode .modal .field label{color:#f4f2e8}
body.dark-mode .google-auth{background:#f3f6f8;color:#23313c}
body.dark-mode .reading-shortcut{color:#e7ebef;border-color:#617181}
/* Reader is a separate consistent application surface. */
.nv-reader [hidden]{display:none!important}
.nv-reader{position:fixed;inset:0;z-index:400;background:#f6f0e7;display:flex;flex-direction:column;color:#252e39;font:14px/1.5 var(--body)}
.nv-reader-top{display:flex;align-items:center;gap:20px;background:#fdfbf7;border-bottom:1px solid #d9d3ca;padding:13px clamp(14px,4vw,48px);min-height:70px}
.nv-reader-exit,.nv-reader-help{background:none;border:1px solid #c9c7c1;padding:10px 15px;color:#2e4558;border-radius:3px;font-weight:700;white-space:nowrap}
.nv-reader-heading{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;min-width:0}.nv-reader-heading small{font:10px var(--mono);letter-spacing:1.1px;color:#6b7280}.nv-reader-heading strong{font:500 20px var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.nv-reader-controls{display:flex;align-items:center;justify-content:center;gap:9px;padding:11px 14px;background:#f5f3ee;flex-wrap:wrap;border-bottom:1px solid #dfd9cf}
.nv-reader-controls button,.nv-reader-controls select{background:#fff;border:1px solid #c5c9c9;color:#273746;min-height:38px;padding:8px 12px;border-radius:3px;font-weight:650;font-size:12px}
.nv-reader-controls label{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:#596874}
.nv-reader-controls button:hover,.nv-reader-top button:hover{background:#e9eef1}
.nv-reader-progress{height:3px;background:#dedcd7}.nv-reader-progress>div{height:100%;width:0;background:#698aa6;transition:width .15s}
.nv-reader-scroller{flex:1;min-height:0;overflow:auto;scrollbar-color:#a9acb0 transparent;overscroll-behavior:contain}
.nv-reader-scroller.paper{background:#f6f0e7;color:#2e2c2b}.nv-reader-scroller.white{background:white;color:#292b32}.nv-reader-scroller.night{background:#212936;color:#f1ede5}
.nv-reader-welcome{max-width:760px;margin:min(9vh,74px) auto;padding:0 24px;text-align:center}
.nv-reader-welcome h2{font:400 clamp(37px,5vw,60px)/1.1 var(--display);letter-spacing:-1.4px;margin:22px auto 15px}
.nv-reader-welcome p{font:16px/1.85 var(--body);max-width:630px;margin:0 auto 28px;color:inherit;opacity:.78}
.nv-kicker{font:10px var(--mono);letter-spacing:2px;color:#64829a}
.nv-reader-choices{display:flex;justify-content:center;flex-wrap:wrap;gap:11px;margin-bottom:19px}
.nv-reader-choices .primary-btn,.nv-reader-choices .secondary-btn{display:inline-flex;align-items:center;justify-content:center}
.nv-reader-note{font-size:12px!important;opacity:.6!important}
.nv-reader-text{max-width:790px;margin:auto;padding:45px 30px 120px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85;font-family:Georgia,serif;letter-spacing:normal}
.nv-epub-stage{height:100%;width:min(930px,100%);margin:auto;padding:12px 10px;min-height:300px}
.nv-reader-bottom{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;border-top:1px solid #dfd9cf;padding:12px;background:#fdfbf7}
.nv-reader-bottom button,.nv-reader-bottom select{border:1px solid #c6cad0;background:white;color:#294055;border-radius:3px;min-height:38px;padding:8px 12px}
.nv-reader-bottom span{font:11px var(--mono);color:#64707e;padding:0 8px}
@media(max-width:700px){.reading-shortcut{padding:9px 10px;font-size:11px}.hero{border-radius:2px}.hero h1{letter-spacing:-1.8px}.nv-reader-top{gap:8px;padding:9px 12px;min-height:60px}.nv-reader-heading small{font-size:8px}.nv-reader-heading strong{font-size:16px}.nv-reader-help{display:none}.nv-reader-exit{font-size:11px;padding:9px}.nv-reader-controls{gap:6px;padding:8px}.nv-reader-controls button,.nv-reader-controls select{padding:7px;font-size:11px}.nv-reader-welcome{margin:45px auto 0}.nv-reader-text{padding:20px 18px 85px}}
@media(max-width:420px){.reading-shortcut{font-size:0;min-width:42px;padding:9px}.reading-shortcut:before{content:'📖';font-size:19px}}

  
/* Novella V7 — interaction polish and reading desk refinement */
:root{--action:#304f68;--outline:#c1c9cb}
body,button,input,select{ -webkit-tap-highlight-color:transparent }
button, a, input, select, textarea{ transition:background-color .16s ease,border-color .16s ease,box-shadow .16s ease,color .16s ease,transform .16s ease }
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #788dc3;outline-offset:3px}
.primary-btn,.secondary-btn,.pill,.google-auth,.auth-button,.nv-reader-controls button{min-height:44px}

/* NOVELLA V11.24 · A fuller, calmer editorial interface. Functional details first. */
:root{--nv24-radius:18px;--nv24-ease:cubic-bezier(.21,.7,.28,1);--nv24-focus:#b6c5ff}
body{letter-spacing:.003em}
#main{max-width:1650px;margin:0 auto;min-width:0}
#main>.nv-explore-intro,#main>.section-head{position:relative}
.hero{border-radius:22px;overflow:hidden}
.hero-copy h1{letter-spacing:-.035em;line-height:1.025}
.edition-note{letter-spacing:.045em}
.topbar{box-shadow:0 4px 20px rgba(13,25,39,.025)}
.search-wrap{box-shadow:0 4px 12px rgba(15,25,40,.035);transition:border-color .18s ease,box-shadow .18s ease}
.search-wrap:focus-within{box-shadow:0 0 0 4px rgba(111,120,166,.12),0 12px 24px rgba(12,24,40,.055)}
.primary-btn,.secondary-btn,.icon-btn,.nv-load-more,.pill,.nav,.nv-source-check{transition:transform .18s var(--nv24-ease),background-color .18s ease,border-color .18s ease,box-shadow .18s ease}
button:focus-visible,a:focus-visible,[role=button]:focus-visible,summary:focus-visible{outline:3px solid var(--nv24-focus);outline-offset:3px}
.book-grid{row-gap:clamp(26px,3vw,39px)}
.book-card-wrap{position:relative;min-width:0;isolation:isolate}
.book-card{position:relative;border:1px solid transparent!important;border-radius:13px!important;padding:6px; margin:-6px;transition:transform .2s var(--nv24-ease),border-color .2s ease,background-color .2s ease}
.book-card:hover,.book-card:focus-visible{background:rgba(123,143,175,.075);border-color:rgba(140,156,186,.24)!important;transform:translateY(-3px)}
.book-card .book-cover{border:1px solid rgba(130,137,144,.12);box-shadow:0 12px 25px rgba(13,23,35,.11)!important}
.book-card:hover .book-cover{transform:translateY(-2px) scale(1.005)}
.quick-save{z-index:2;box-shadow:0 5px 16px rgba(10,25,40,.2);transition:transform .15s ease,background .15s ease}
.quick-save:hover{transform:scale(1.055)}
.book-card h3{line-height:1.3;letter-spacing:-.012em}
.author{line-height:1.4;min-height:1.5em}

.nv-results-grid .book-grid{margin-top:10px}
.nv-main-book{box-shadow:0 12px 38px rgba(11,21,36,.06)!important}
.nv-main-book .nv-main-art .book-cover{box-shadow:0 12px 25px rgba(15,32,51,.16)}
.nv-main-copy p{max-width:65ch}
.filter-bar select,.filter-bar button{min-height:46px}
.nv-load-more{border-radius:16px;min-height:72px;box-shadow:0 7px 19px rgba(20,30,46,.055)}
.nv-load-more:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 13px 28px rgba(20,30,46,.09)}
.detail-hero{align-items:start;gap:clamp(25px,5vw,80px)}
.detail-info h1{letter-spacing:-.035em;line-height:1.08;margin-bottom:12px}
.detail-info .byline{font-size:clamp(15px,1.7vw,20px)}
.nv-synopsis .description{font-size:clamp(15px,1.3vw,18px);line-height:1.75;max-width:72ch;margin-bottom:12px}
.nv-synopsis details{max-width:72ch;margin-bottom:20px;font-size:14px;line-height:1.65}
.nv-synopsis details summary{color:var(--purple);font-size:13px;font-weight:700;cursor:pointer;display:inline-block;padding:7px 0}
.nv-synopsis details p{margin:7px 0;color:var(--sub)}
.nv-detail-main-actions{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}
.nv-detail-main-actions>*{min-height:46px;border-radius:11px}
.nv-smart-access{border:1px solid var(--line-strong);border-radius:16px!important;padding:20px 22px!important;background:var(--canvas)!important;max-width:850px;box-shadow:0 6px 25px rgba(9,19,34,.04)}

.nv-detail-extra[open]>summary>span:last-child{transform:rotate(180deg)}
.nv-detail-extra-content{padding:0 18px 17px}

.nv-source-grid{padding:6px 0 2px}

.nv-reader-choices{margin-top:16px!important}

.nv-reader-access{border-radius:14px!important}
.nv-annex-gate{box-shadow:0 22px 60px rgba(10,22,38,.09)!important}
.nv-annex-message{font-weight:600;line-height:1.5;overflow-wrap:anywhere}
.nv-profile-card,.nv-source-network,.nv-main-book{overflow-wrap:anywhere}

body.dark-mode .nv-smart-access>strong,body.dark-mode .nv-detail-extra>summary{color:#f6f6f8!important}
body.dark-mode .nv-smart-access>p{color:#cedbe4!important}

@media(min-width:1200px){.detail-info{max-width:900px}.detail-hero>.book-cover{position:sticky;top:130px}}
@media(max-width:780px){
 .nv-detail-main-actions>*{flex:1 1 46%}

@media(max-width:520px){

 .nv-smart-access{padding:17px!important}

 .nv-reader-choices>*{max-width:100%!important}
}
@media(prefers-reduced-motion:reduce){.book-card,.quick-save,.nv-load-more,.nv-source-tile{transition:none!important;transform:none!important}}


/* V11.24: searchable multi-book bookshelf and combined reading journal. */
.nv-personal-toolbar{display:flex;flex-wrap:wrap;align-items:center;column-gap:20px;row-gap:8px;padding:18px 20px;border:1px solid var(--line);background:var(--canvas);border-radius:14px;margin:20px 0 17px}
.nv-personal-toolbar>label{font-weight:650;color:var(--ink);font-size:13px;flex-basis:100%}
.nv-personal-toolbar>small{font-size:12px;color:var(--sub);margin-left:auto}
.nv-personal-search{display:flex;align-items:center;flex:1 1 280px;max-width:640px;min-width:0;position:relative}
.nv-personal-search>span{position:absolute;left:13px;font-size:22px;color:var(--sub);pointer-events:none}
.nv-personal-search>input{width:100%;height:46px;background:var(--paper);border:1px solid var(--line-strong);border-radius:9px;color:var(--ink);font-size:14px;padding:10px 15px 10px 43px;outline-offset:2px}
.nv-personal-search>input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(88,77,131,.13);outline:none}
.nv-journal-tabs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 19px}
.nv-journal-tab{background:transparent;border:1px solid var(--line-strong);padding:9px 14px;font-size:13px;color:var(--sub);border-radius:8px;min-height:40px;transition:background .14s,color .14s}
.nv-journal-tab.active{background:var(--purple);color:white;border-color:var(--purple)}
.nv-journal-row{border-radius:11px;text-align:left;min-height:83px;gap:14px;padding:12px 15px}
.nv-journal-description{min-width:0;display:flex;flex-direction:column;gap:3px;flex:1}
.nv-journal-description strong{overflow-wrap:anywhere}
.nv-journal-description small{overflow-wrap:anywhere}
.nv-journal-tags{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:3px}
.nv-journal-tags span{font-size:10px;font-weight:650;letter-spacing:.1px;padding:3px 7px;border:1px solid var(--line);border-radius:12px;color:var(--purple);background:var(--lav)}
.nv-journal-date{margin-left:auto;white-space:nowrap;color:var(--sub);font-size:11px}

/* NOVELLA V11.25 · Three-column editorial reading foyer. Specific classes keep
   the redesign isolated to Discover; other pages, interactions and APIs remain unchanged. */
.nv25-opening{display:grid;grid-template-columns:minmax(0,1.73fr) minmax(285px,.79fr);gap:clamp(14px,1.8vw,25px);align-items:stretch;margin:clamp(15px,2.4vw,27px) 0 0;min-width:0}

.nv25-feature-copy{min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:0;padding:clamp(34px,4.4vw,72px) clamp(20px,3.3vw,52px)}

.nv25-sparkle{font-size:13px;color:#7e75ab;margin-right:8px}
.nv25-feature h1{font:400 clamp(45px,4.2vw,72px)/1.04 var(--display);letter-spacing:-.045em;margin:22px 0 20px;color:#273846;max-width:10.7em}

.nv25-feature-actions .primary-btn,.nv25-feature-actions .secondary-btn{font-weight:700;min-height:46px;border-radius:10px;padding:12px 16px;font-size:12px}
.nv25-feature-foot{margin-top:auto;padding-top:30px;font:500 10px/1.4 var(--mono);letter-spacing:.05em;color:#70818d}
.nv25-foot-mark{color:#8d85b0;margin-right:6px}
.nv25-cover-stage{min-width:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:linear-gradient(145deg,#dde5ed 0%,#d2d0e0 100%);border:0;border-left:1px solid #c5d0da;cursor:pointer;padding:75px 15px 70px}

.nv25-cover-credit{position:absolute;bottom:27px;left:20px;right:20px;z-index:2;background:#fffefaed;border:1px solid #d8dadc;padding:11px 14px;border-radius:10px;box-shadow:0 8px 30px #2128321b;text-align:left}

.nv25-rail{min-width:0;display:grid;grid-template-rows:minmax(0,1.55fr) minmax(0,1fr) auto;gap:clamp(12px,1.35vw,18px)}
.nv25-rail-card{border:1px solid var(--line-strong);background:var(--canvas);border-radius:18px;padding:clamp(18px,2vw,28px);display:flex;flex-direction:column;min-width:0;overflow:hidden}

/* NOVELLA V11.26 · Centered literary foyer, with decorative page margins.
   This layout affects Discover only; the book and account flows are unchanged. */
.nv26-foyer{
 display:grid;grid-template-columns:minmax(110px,1fr) minmax(0,900px) minmax(110px,1fr);
 gap:clamp(14px,1.6vw,28px);max-width:1490px;width:100%;
 margin:clamp(20px,2.7vw,32px) auto 0;align-items:stretch;min-width:0;
}
.nv26-center{display:flex;flex-direction:column;gap:14px;min-width:0;max-width:900px;width:100%;margin-inline:auto}
.nv26-center .nv25-feature{
 display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.83fr);
 min-height:535px;width:100%;border-radius:19px;
}
.nv26-center .nv25-feature-copy{padding:38px clamp(23px,3vw,46px);justify-content:center}

.nv26-center .nv25-cover-credit{left:16px;right:16px;bottom:21px}
.nv26-center .nv25-rail{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(0,.94fr) minmax(0,.9fr);grid-template-rows:1fr;gap:12px;min-width:0}
.nv26-center .nv25-rail-card{min-height:191px;padding:17px;border-radius:15px;overflow:visible}
.nv26-center .nv25-rail-top{margin-bottom:12px}
.nv26-center .nv25-pick-card{grid-column:auto;grid-row:auto}
.nv26-center .nv25-pick-content{grid-template-columns:75px minmax(0,1fr);gap:12px;align-items:center}
.nv26-center .nv25-rail-card h2{font-size:clamp(20px,1.75vw,26px);line-height:1.1;margin:7px 0 7px}
.nv26-center .nv25-rail-card p{font-size:12px;line-height:1.47;margin:0 0 12px}
.nv26-center .nv25-pill{font-size:8px;padding:4px 7px}
.nv26-center .nv25-rail-link{font-size:11px;margin-top:1px}
.nv26-center .nv25-mood-links{grid-template-columns:1fr 1fr;gap:6px}

.nv26-center .nv25-mood-links button:last-child{grid-column:1/-1}
.nv26-center .nv25-my-card,.nv26-center .nv25-mood-card{min-height:191px}
.nv26-margin{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
 border-block:1px solid var(--line-strong);padding:25px 12px 26px;position:relative;color:var(--sub);text-align:center}
.nv26-margin:after{content:"";position:absolute;top:51px;bottom:46px;width:1px;z-index:-1;background:linear-gradient(transparent,var(--line),var(--line),transparent)}
.nv26-margin-left:after{left:9px}.nv26-margin-right:after{right:9px}
.nv26-margin-heading{font:600 9px/1.7 var(--mono);letter-spacing:.12em;color:var(--sub);max-width:158px;opacity:.85}
.nv26-spine-cluster{display:flex;align-items:flex-end;justify-content:center;gap:6px;height:155px;transform:rotate(-8deg);margin:5px auto}
.nv26-spine-cluster span{display:block;width:25px;height:116px;border:1px solid #a5a0aa;border-radius:2px 4px 3px 2px;background:linear-gradient(90deg,#b7a8c5,#d0c5d6 75%,#a89ab8);box-shadow:3px 6px 6px #27313a14}
.nv26-spine-cluster span:nth-child(2){height:141px;background:linear-gradient(90deg,#7d9ca5,#b8d0cd 78%,#829eaa)}
.nv26-spine-cluster span:nth-child(3){height:104px;background:linear-gradient(90deg,#b89d84,#e2ccad 78%,#b89d84)}
.nv26-spine-cluster span:nth-child(4){height:131px;background:linear-gradient(90deg,#9d8d9f,#d1c5cd 78%,#9d8d9f)}
.nv26-spine-cluster span:after{content:"";display:block;border-block:1px solid #fff8;margin:14px 3px 0;height:72%;opacity:.7}
.nv26-side-quote{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:170px;margin:0 auto}
.nv26-side-quote p{font:italic 22px/1.21 var(--display);margin:0;color:var(--sub);overflow-wrap:break-word}
.nv26-quote-glyph{font:52px/.65 var(--display);color:var(--purple);opacity:.65}
.nv26-side-rule{display:block;width:36px;height:1px;background:var(--line-strong)}

.nv26-orbit-art{width:min(100%,164px);aspect-ratio:1;position:relative;display:grid;place-items:center;margin:0 auto}
.nv26-orbit-art:before,.nv26-orbit-art:after{content:"";position:absolute;border:1px solid #aba3beaa;border-radius:50%;inset:6% 10% 16%}
.nv26-orbit-art:after{transform:rotate(62deg) scaleX(.55);border-color:#93a9b0b5}
.nv26-orbit-star{font:60px/1 var(--display);color:#a497bc;z-index:1;transform:translateY(-4px)}
.nv26-orbit-dot{position:absolute;right:8%;top:18%;font:36px var(--display);color:#91a5ac}
.nv26-end-mark{display:flex;align-items:end;flex-direction:column;gap:3px}.nv26-end-mark span:first-child{font:italic 35px/1 var(--display);color:var(--purple)}

 if(stage==='original')next.push({src:nvCoverEdition(book),stage:'edition'},{src:nvCoverIsbn(book),stage:'isbn'});

   for(const edition of matched.slice(0,10)){

     if(!Number.isSafeInteger(coverId)||coverId<=0)continue;
     const image=await nvProbeCover(`https://covers.openlibrary.org/b/id/${coverId}-M.jpg?default=false`);
     if(image)return image;

   if(normTitle(record.title)!==normTitle(b.title))continue;

   const wanted=normAuthor(b.author||'');

   if(Number.isSafeInteger(record.cover_i)&&record.cover_i>0)candidates.push('https://covers.openlibrary.org/b/id/'+record.cover_i+'-M.jpg?default=false');

 // second (strictly verified) search rather than concluding there is no cover.

function nvCoverQueueBook(key){

function nvCoverPump(){

  if(!book){nvCoverQueued.delete(key);continue}
  nvCoverActive++;nvCoverLookupCount++;

   .catch(()=>nvSaveCover(book,''))

}
function nvCoverScan(){

}
function nvCoverBoot(){

// Compact, scoped search snapshots: draw results immediately on repeat visits.

const NV_SNAPSHOT_MAX=9, NV_SNAPSHOT_TTL=14*24*60*60*1000;

let nvStarterActive=false, nvStarterCursor=0, nvStagedBooks=[], nvRemoteMore=false;
let nvSessionBrowsePool=null;
function nvBuildSessionBrowsePool(){

function nvInstantMore(){return nvStarterActive&&(nvStarterCursor<nvBuildSessionBrowsePool().length||nvStagedBooks.length>0)}
function nvUpdateStarterMore(){hasMore=nvInstantMore()||nvRemoteMore}
function nvRevealBooks(){

 const next=[];
 if(nvStarterCursor<nvBuildSessionBrowsePool().length){next.push(...nvBuildSessionBrowsePool().slice(nvStarterCursor,nvStarterCursor+12));nvStarterCursor+=next.length}
 if(next.length<12&&nvStagedBooks.length){
  const candidates=nvDistinct(nvStagedBooks);
  const accessible=candidates.filter(b=>b.source==='gutenberg'&&b.copyright!==true);
  const discovery=candidates.filter(b=>!(b.source==='gutenberg'&&b.copyright!==true));
  const want=12-next.length,fullBudget=Math.max(0,Math.ceil(want*.8));
  const chosen=[...accessible.slice(0,fullBudget),...discovery.slice(0,Math.max(0,want-Math.min(fullBudget,accessible.length)))];
  if(chosen.length<want)chosen.push(...candidates.filter(b=>!chosen.includes(b)).slice(0,want-chosen.length));

let searchBusy=false, nvExtraCatalogPending=false, nvBrowseRoot=0;

// Shuffle genre order only once per cycle; persist across refreshes on this device.
function nvShuffle(array){const a=[...array];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nvGenreCycle(name){
 let value=getLocal(name,null);
 if(!value||!Array.isArray(value.order)||value.order.length!==allGenres.length){value={order:nvShuffle(allGenres),index:0}}
 if(value.index>=value.order.length){value={order:nvShuffle(allGenres),index:0}}
 return value;
}
function nvNextGenres(name,count){const q=nvGenreCycle(name);const picked=[];
 for(let i=0;i<count;i++){
  if(q.index>=q.order.length){q.order=nvShuffle(allGenres);q.index=0}
  picked.push(q.order[q.index++]);

}
function nvWorkFingerprint(b){const a=normAuthor(b.author).split(/\s+/).filter(w=>w&&!/^[0-9]+$/.test(w)&&w!=='and').sort().join(' ');return normTitle(b.title)+'|'+a}

// "Newest" must query the catalogue, not just rearrange 24 locally downloaded records.
// Recent works are filtered on Open Library's first-published year (NOT a site's update date).
function nvCatalogQuery(q='',genre='',mode=sort){
 const base=String(q||'').trim()||(genre?'subject:"'+String(genre).replace(/"/g,'')+'"':'fiction');
 if(mode!=='newest'||q)return base;
 const year=new Date().getFullYear();
 const recent='first_publish_year:['+(year-1)+' TO '+year+']';
 return (genre?'subject:"'+String(genre).replace(/"/g,'')+'" AND ':'')+recent;
}

// V11.20: Search is a match gate FIRST and a popularity sort SECOND.
// Open Library's broad full-text results may mention a query only in description or
// metadata. Those are not automatically relevant title / author matches.
function nvQueryTokens(value){
 const text=String(value||'').toLowerCase().normalize('NFKD')
  .replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
 const tokens=text.split(/\s+/).filter(Boolean);
 const meaningful=tokens.filter(t=>!['a','an','and','the','of','in','on','for','to','at','by','with'].includes(t));
 return meaningful.length?meaningful:tokens;
}
function nvTokenLike(a,b){
 if(a===b)return true;
 if(a.length>=4&&b.length>=4&&(a.startsWith(b)||b.startsWith(a)))return Math.min(a.length,b.length)/Math.max(a.length,b.length)>=.73;
 if(Math.min(a.length,b.length)<5||Math.abs(a.length-b.length)>1)return false;
 // At most one character typo; avoids unrelated loose-matching results.
 let i=0,j=0,changes=0;
 while(i<a.length&&j<b.length){
  if(a[i]===b[j]){i++;j++;continue}
  if(++changes>1)return false;
  if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++}
 }
 return changes+(a.length-i)+(b.length-j)<=1;
}
const NV_GENRE_QUERY_KEYS=new Set(allGenres.map(g=>nvQueryTokens(g).join(' ')));
function nvSearchRelevance(book,query){
 const tokens=nvQueryTokens(query);
 if(!tokens.length)return 1;
 const qt=tokens.join(' '),title=nvQueryTokens(book.title),author=nvQueryTokens(book.author);
 const titleText=title.join(' '),authorText=author.join(' ');
 const matchCount=(arr)=>tokens.filter(t=>arr.some(v=>nvTokenLike(t,v))).length;
 const t=matchCount(title),a=matchCount(author),needed=Math.max(1,Math.ceil(tokens.length*.8));
 // Exact work/series titles take priority over other matches even when newer.
 if(titleText===qt)return 700;
 if(titleText.startsWith(qt+' '))return 620;
 if(titleText.includes(' '+qt+' '))return 560;
 if(t>=needed)return 410+Math.min(120,Math.round(t/tokens.length*100))-(title.length>tokens.length?Math.min(38,title.length-tokens.length)*2:0);
 if(a>=needed)return authorText===qt?545:470;
 // Generic genre searches can match an actual subject, never unrelated book metadata.
 const genreQuery=NV_GENRE_QUERY_KEYS.has(qt);
 if(genreQuery){
  const subjects=(book.genres||[]).slice(0,18).map(g=>nvQueryTokens(g).join(' '));
  if(subjects.some(v=>v===qt||v.startsWith(qt+' ')||v.includes(' '+qt+' ')))return 260;
 }

}
function nvPopularityScore(book){
 // Edition count (Open Library) and downloads (Gutenberg) are different proxies;
 // log scale prevents a huge provider count from defeating a strong title match.
 const raw=Math.max(0,Number(book.popularity)||0);
 return Math.log1p(raw)*(book.source==='gutenberg'?12:24);

function nvMatchAndRank(items,query='',mode='relevance'){

  ranked.sort((a,b)=>b.match-a.match||b.popularity-a.popularity||Number(!!b.b.cover)-Number(!!a.b.cover)||a.index-b.index);

// An on-demand GITenberg resolver expands the reader beyond the seven curated editions.
// A catalog entry is not proof that full text is fetchable. Never access restricted books.
const readerSourcePending=new Map();
const GITENBERG_API='https://api.github.com';
async function gitJSON(path){
  const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),11500);
  try{
    const res=await fetch(GITENBERG_API+path, {signal:controller.signal,headers:{Accept:'application/vnd.github+json'}});
    if(res.status===403||res.status===429)throw Error('The free ebook source is busy or rate limited. Please try again later.');
    if(!res.ok)throw Error('The source catalogue is currently unavailable ('+res.status+').');
    return await res.json();
  } finally {clearTimeout(timer)}
}
async function discoverGitText(b){
  if(b?.source!=='gutenberg'||!/^\d{1,7}$/.test(String(b.id)))return null;
  const id=String(b.id);
  if(Object.hasOwn(CURATED_TEXTS,id))return CURATED_TEXTS[id];
  const memo=getLocal('text-source:'+id,null);
  if(memo?.url && /^https:\/\/raw\.githubusercontent\.com\/GITenberg\//.test(memo.url))return memo.url;
  // A short-lived negative result avoids repeating failed searches on each visit.
  if(memo?.miss && Date.now()-memo.when<2*60*60*1000)return null;
  if(readerSourcePending.has(id))return readerSourcePending.get(id);
  const lookup=(async()=>{
    // Never scrape Gutenberg's live book files. GITenberg is a separate GitHub archive.
    const qs=new URLSearchParams({q:'org:GITenberg '+id+' in:name',per_page:'20'});
    const result=await gitJSON('/search/repositories?'+qs.toString());
    const repo=(result.items||[]).find(r=>r?.full_name?.startsWith('GITenberg/')&&r.name.endsWith('_'+id));
    if(!repo){putLocal('text-source:'+id,{miss:true,when:Date.now()});return null}
    const entries=await gitJSON('/repos/'+encodeURIComponent(repo.owner.login)+'/'+encodeURIComponent(repo.name)+'/contents');
    if(!Array.isArray(entries))return null;
    // Prefer well-formed plain UTF-8 book files at the repository root.
    const files=entries.filter(f=>f.type==='file'&&/\.txt$/i.test(f.name)&&!/(license|readme|contribut|metadata)/i.test(f.name)&&f.size>=3000&&f.size<=8*1024*1024);
    const file=files.sort((a,b)=>{
      const score=f=>(f.name===id+'-0.txt'?0:f.name===id+'.txt'?1:f.name.startsWith(id)?2:3);
      return score(a)-score(b);
    })[0];
    const target=file?.download_url;
    if(!target||!/^https:\/\/raw\.githubusercontent\.com\/GITenberg\//.test(target)){
      putLocal('text-source:'+id,{miss:true,when:Date.now()});return null;
    }
    putLocal('text-source:'+id,{url:target,when:Date.now()});
    return target;
  })().finally(()=>readerSourcePending.delete(id));
  readerSourcePending.set(id,lookup);
  return lookup;
}

   db.from('reading_history').select('*').eq('user_id',signedInId).order('accessed_at',{ascending:false}).limit(1000)

// V11.16: Preserve the full edition, never accept a size threshold alone as proof.
const NV_TEXT_MAX_BYTES=12*1024*1024;
const NV_PG_START=/^\s*\*{3}\s*START OF (?:THE |THIS )?PROJECT GUTENBERG (?:EBOOK|E-BOOK)\b[^\r\n]*\*{3}\s*$/im;
const NV_PG_END=/^\s*(?:\*{3}\s*END OF (?:THE |THIS )?PROJECT GUTENBERG (?:EBOOK|E-BOOK)\b[^\r\n]*\*{3}|end of (?:the )?project gutenberg(?:'s)? (?:ebook|e-book)\b[^\r\n]*)\s*$/im;
function nvInspectGutenbergText(raw){
 if(typeof raw!=='string'||raw.length<3000)return {valid:false,complete:false,reason:'The downloaded text is too short to verify.'};
 const text=raw.replace(/^\uFEFF/,'');
 const begin=NV_PG_START.exec(text);
 const after=begin?begin.index+begin[0].length:0;
 const end=NV_PG_END.exec(text.slice(after));
 const endAt=end?after+end.index:-1;
 // A footer establishes the file reached Gutenberg's end marker; it does not establish local copyright status.
 const complete=!!end&&endAt-after>=2400;
 const novel=complete?(begin?text.slice(after,endAt).trim():text.slice(0,endAt).trim()):text;
 return {valid:true,complete,text:novel,reason:complete?'Gutenberg end-of-ebook marker found.':'This source has no verifiable end-of-ebook marker.'};
}
function nvTextSourceURL(link){
 try{const u=new URL(link);if(u.protocol!=='https:')return false;
  return ['www.gutenberg.org','gutenberg.org','raw.githubusercontent.com','www.gutenberg.net','gutenberg.net'].includes(u.hostname)
   &&(u.hostname!=='raw.githubusercontent.com'||u.pathname.startsWith('/GITenberg/'));
 }catch{return false}
}
function nvGutenbergFormatURLs(formats,type){
 return Object.entries(formats||{}).filter(([key,value])=>key.toLowerCase().startsWith(type)&&nvTextSourceURL(value))
  .sort(([a],[b])=>Number(!/utf-8/i.test(a))-Number(!/utf-8/i.test(b))).map(([,value])=>value);
}
async function nvDownloadFullText(url,timeout=10500){
 if(!nvTextSourceURL(url))throw Error('Untrusted ebook source');
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeout);
 try{
  const response=await fetch(url,{signal:controller.signal,cache:'force-cache'});
  if(!response.ok)throw Error('Source returned '+response.status);
  const length=Number(response.headers.get('content-length')||0);
  if(length>NV_TEXT_MAX_BYTES)throw Error('Book file exceeds size limit');
  const blob=await response.blob();
  if(blob.size>NV_TEXT_MAX_BYTES)throw Error('Book file exceeds size limit');
  const raw=await blob.text();
  // Gutenberg also publishes complete HTML editions. Convert their body to text
  // before checking the same end-of-ebook marker; never assume HTML alone is complete.
  const isHtml=/\b(?:text\/html|application\/xhtml\+xml)\b/i.test(response.headers.get('content-type')||'')||/\.x?html?(?:$|[?#])/i.test(url);
  return nvInspectGutenbergText(isHtml?nvHtmlToReadableText(raw):raw);
 }finally{clearTimeout(timer)}
}
async function nvGutenbergSourceList(book,deep=false){
 const id=String(book.id),sources=[],epubs=[];
 if(book.copyright===true)return {sources,epubs,deferred:false};
 const add=(list,url)=>{if(nvTextSourceURL(url)&&!list.includes(url))list.push(url)};
 add(sources,CURATED_TEXTS[id]);
 for(const link of nvGutenbergFormatURLs(book.formats,'text/plain'))add(sources,link);
 for(const link of nvGutenbergFormatURLs(book.formats,'text/html'))add(sources,link);
 for(const link of nvGutenbergFormatURLs(book.formats,'application/epub+zip'))add(epubs,link);
 // Fast path: don't delay a known text download on a metadata API or GitHub lookup.
 if(!deep&&sources.length)return {sources,epubs,deferred:true};
 // Lookup providers in parallel only when the first sources aren't known, or have failed.
 const responses=await Promise.allSettled([
  fetchJSON('https://gutendex.com/books/'+encodeURIComponent(id),{timeout:6500}),
  discoverGitText(book)
 ]);
 if(responses[0].status==='fulfilled'&&responses[0].value?.copyright!==true){
  const data=responses[0].value;
  for(const link of nvGutenbergFormatURLs(data?.formats,'text/plain'))add(sources,link);
  for(const link of nvGutenbergFormatURLs(data?.formats,'text/html'))add(sources,link);
  for(const link of nvGutenbergFormatURLs(data?.formats,'application/epub+zip'))add(epubs,link);
 }
 if(responses[1].status==='fulfilled')add(sources,responses[1].value);
 return {sources,epubs,deferred:false};
}
function nvHtmlToReadableText(markup){
 const doc=new DOMParser().parseFromString(markup,'text/html');
 doc.querySelectorAll('script,style,noscript,nav,iframe,object,embed,svg,form').forEach(n=>n.remove());
 const block=new Set(['P','DIV','SECTION','ARTICLE','H1','H2','H3','H4','H5','H6','BLOCKQUOTE','LI','UL','OL','BR','HR','PRE','TR']);
 function read(n){if(n.nodeType===3)return n.nodeValue||'';if(n.nodeType!==1)return '';
  const txt=Array.from(n.childNodes).map(read).join('');return block.has(n.nodeName)?'\n'+txt+'\n':txt;}
 return read(doc.body||doc.documentElement).replace(/[ \t]+\n/g,'\n').replace(/\n{4,}/g,'\n\n\n').trim();
}
async function nvCheckEpubSpine(buffer){
 const zip=await window.JSZip.loadAsync(buffer);
 const container=zip.file('META-INF/container.xml');if(!container)throw Error('This EPUB is missing its container metadata.');
 const xml=new DOMParser().parseFromString(await container.async('text'),'application/xml');
 const root=xml.getElementsByTagName('rootfile')[0];const pkg=root?.getAttribute('full-path');
 if(!pkg||!zip.file(pkg))throw Error('The EPUB package is missing.');
 const opf=new DOMParser().parseFromString(await zip.file(pkg).async('text'),'application/xml');
 if(opf.querySelector('parsererror'))throw Error('The EPUB package is damaged.');
 const resources=new Map(Array.from(opf.getElementsByTagName('item')).map(e=>[e.getAttribute('id'),e.getAttribute('href')]));
 const sequence=Array.from(opf.getElementsByTagName('itemref')).filter(e=>e.getAttribute('linear')!=='no');
 if(!sequence.length)throw Error('No readable spine chapters were found.');
 const directory=pkg.includes('/')?pkg.slice(0,pkg.lastIndexOf('/')+1):'';
 const missing=sequence.filter(e=>{
  const ref=resources.get(e.getAttribute('idref'));if(!ref)return true;
  try{const u=new URL(ref,'https://novella.invalid/'+directory);const path=decodeURIComponent(u.pathname.slice(1));return !zip.file(path)}catch{return true}
 });
 if(missing.length)throw Error('The EPUB is incomplete: '+missing.length+' chapter file(s) are missing.');
 return sequence.length;
}

function nvFriendlyAuthRateLimit(error){
 const raw=String(error?.message||'');
 const status=Number(error?.status||error?.statusCode||0);
 const isRateLimited=status===429||/rate.?limit|too many requests|for security purposes.*after\s+\d+\s+seconds?/i.test(raw);
 if(!isRateLimited)return '';
 const seconds=raw.match(/after\s+(\d+)\s+seconds?/i);
 if(seconds){
  const n=Math.max(1,Math.min(3600,Number(seconds[1])));
  return `Email request limit reached. Please try again in ${n} seconds. This wait is set by the sign-in provider; Google sign-in may work meanwhile.`;
 }
 if(/email/i.test(raw))return 'Email service limit reached. Please use Google sign-in or try again later; Novella cannot shorten this provider limit.';
 return 'Sign-in service is temporarily limiting requests. Please retry shortly or try Google sign-in.';
}

async function initAuth(){

 try{
  const {data,error}=await db.auth.getSession();if(error)throw error;
  const intent=nvIntentTake(),expectedId=nvExpectedGoogleTake();
  if(expectedId&&data?.session?.user?.id&&data.session.user.id!==expectedId){
   try{await db.auth.signOut({scope:'local'})}catch{}
   ++nvAuthEpoch;me=null;nvProfile=null;shelves=[];historyRows=[];userUI();
   nvShowPicker('Google returned a different account. Choose the matching Google account to continue.');
  }else if(data?.session?.user)await nvCheckRegistration(data.session.user,intent);
  else{me=null;nvProfile=null;userUI()}
  db.auth.onAuthStateChange((event,session)=>{
   if((event==='TOKEN_REFRESHED'||event==='SIGNED_IN')&&session){
    nvUpdateKnownTokenFromEvent(session);
    // Confirmation links can refresh the same session without changing the account ID.
    if(session.user?.id===me?.id&&(session.user.email!==me.email||
      nvAvatarData(session.user.user_metadata?.novella_avatar)!==nvCurrentAvatar())){
      setTimeout(()=>{if(me?.id!==session.user.id)return;me=session.user;nvSyncRememberedIdentity(me);userUI();if(screen==='profile')paint();},0);
    }
   }
   if(event==='USER_UPDATED'&&session?.user?.id===me?.id){
    setTimeout(()=>{if(me?.id!==session.user.id)return;me=session.user;nvSyncRememberedIdentity(me);userUI();if(screen==='profile')paint();},0);
   }
   if(event==='PASSWORD_RECOVERY'){recoveryMode=true;setTimeout(()=>openAuth('new-password'),0);return}
   if(event==='SIGNED_IN'){
    // Supabase callbacks must not await other Auth APIs inside the callback.
    setTimeout(()=>{
     if(nvPickerBusy)return;
     const current=nvIntentTake();
     if(session?.user&&nvPendingGoogle?.id!==session.user.id&&(!me||me.id!==session.user.id))nvCheckRegistration(session.user,current).catch(()=>{});
    },0);
   }else if(event==='SIGNED_OUT')setTimeout(()=>{if(!nvPendingGoogle&&!me){nvProfile=null;userUI()}},0);
  });
  if(location.hash.includes('type=recovery')){recoveryMode=true;openAuth('new-password')}
  else setTimeout(nvMaybeAskOnOpen,160);
 }catch{me=null;nvProfile=null;userUI();notify('Account service temporarily unavailable. Guest browsing still works.')}
}


async function nvSaveIdentityMeta(fields,statusId,working='Saving…',done='Saved.'){
 const status=$(statusId),owner=me?.id,epoch=nvAuthEpoch;
 if(!db||!owner){if(status)status.textContent='Please sign in again.';return false}
 if(status)status.textContent=working;
 try{
  const {data,error}=await db.auth.updateUser({data:fields});if(error)throw error;
  if(me?.id!==owner||epoch!==nvAuthEpoch)throw Error('Your account changed. Please check the updated profile.');
  me=data?.user||{...me,user_metadata:{...me.user_metadata,...fields}};
  nvSyncRememberedIdentity(me);userUI();if(status)status.textContent=done;

/* Novella photo originals are browser-local (IndexedDB), account-scoped, and never sent
   to Supabase. Only the cropped avatar is synced. Browser data clearing removes originals. */
const NV_ORIGINAL_PHOTO_DB='novella-private-photo-originals-v1';
function nvPhotoVersion(data){const s=String(data||'');return s?s.length+'|'+s.slice(0,64)+'|'+s.slice(-64):'';}
function nvPhotoOriginalDB(){
 return new Promise((resolve,reject)=>{
  if(!('indexedDB' in window)){reject(Error('Original-photo storage is unavailable here.'));return}
  const request=indexedDB.open(NV_ORIGINAL_PHOTO_DB,1);
  request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('photos'))request.result.createObjectStore('photos')};
  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error||Error('Could not open photo storage.'));
  request.onblocked=()=>reject(Error('Photo storage is blocked by another open tab.'));
 });
}
async function nvPhotoOriginalGet(owner,avatar){
 if(!owner)return null;
 const db=await nvPhotoOriginalDB();
 try{return await new Promise((resolve,reject)=>{const tx=db.transaction('photos','readonly');const req=tx.objectStore('photos').get(owner);req.onsuccess=()=>{const row=req.result;resolve(row?.blob instanceof Blob&&row.version===nvPhotoVersion(avatar)?row.blob:null)};req.onerror=()=>reject(req.error||Error('Could not read original photo.'))})}
 finally{db.close()}
}
async function nvPhotoOriginalPut(owner,file,avatar){
 if(!owner||!(file instanceof Blob))return false;
 const db=await nvPhotoOriginalDB();
 try{return await new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put({blob:file,version:nvPhotoVersion(avatar)},owner);tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error||Error('Could not preserve original photo.'));tx.onabort=()=>reject(tx.error||Error('Original photo storage was aborted.'))})}
 finally{db.close()}
}
async function nvPhotoOriginalRemove(owner){
 if(!owner)return;
 const db=await nvPhotoOriginalDB();
 try{await new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(owner);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||Error('Could not clear photo.'))})}
 finally{db.close()}
}
function nvPhotoOriginalClearBrowser(){try{indexedDB.deleteDatabase(NV_ORIGINAL_PHOTO_DB)}catch{}}

function nvPhotoCropGeometry(state,canvasSize=360){
 const turned=state.angle%180!==0;

 const h=turned?state.img.naturalWidth:state.img.naturalHeight;
 const scale=Math.max(canvasSize/w,canvasSize/h)*state.zoom;

function nvPhotoEditorDraw(){

 st.offsetX=Math.max(-g.maxX,Math.min(g.maxX,st.offsetX));
 st.offsetY=Math.max(-g.maxY,Math.min(g.maxY,st.offsetY));
 c.save();c.clearRect(0,0,size,size);c.fillStyle='#e7e7ef';c.fillRect(0,0,size,size);
