/* NOVELLA / THE READING ROOM · editorial interface system
   Paper, ink, one indigo accent, quiet rules. No gradient-heavy UI. */
:root {
 --paper:#f8f6f2; --canvas:#fbfaf7; --white:#ffffff; --ink:#26252b;
 --sub:#56535f; --muted:#77737b; --line:#e0dcd7; --line-strong:#cbc4bd;
 --lav:#e8e4f3; --purple:#584d83; --purple-ink:#453b70;
 --blue:#e8eff3; --accent:#b8d5e3; --copper:#986444;
 --display:'Newsreader',Georgia,serif; --body:'DM Sans',Arial,sans-serif;
 --mono:'IBM Plex Mono',ui-monospace,monospace;
 --shadow:0 14px 35px rgba(29,26,38,.055);
}
* {box-sizing:border-box}
html{scroll-behavior:smooth}
body {margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea {font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[role=button]:focus-visible{outline:2px solid #786cb0;outline-offset:3px}
button:disabled{cursor:not-allowed;opacity:.6}
.shell{display:flex;min-height:100vh;max-width:2000px;margin:0 auto}
.sidebar {position:sticky;top:0;flex:0 0 238px;height:100vh;display:flex;flex-direction:column;
 background:#f6f3ef;border-right:1px solid var(--line);padding:27px 18px 20px;z-index:50}
.brand{font:500 33px/1 var(--display);letter-spacing:-1.5px;display:flex;align-items:center;gap:8px;padding:2px 8px 0; margin:0 0 55px;color:var(--ink)}
.brand-icon {border:1px solid var(--ink);width:29px;height:32px;display:grid;place-items:center;border-radius:50% 50% 3px 3px;font:500 21px var(--display);letter-spacing:0;transform:rotate(-7deg)}
.brand-dot{color:var(--purple)}
.side-label{font:500 10px/1.4 var(--mono);letter-spacing:1.3px;color:#726e76;padding:0 9px;margin:0 0 12px}
.sidebar nav{display:grid;gap:2px}
.sidebar nav button{position:relative;border:0;background:transparent;text-align:left;display:flex;align-items:center;gap:10px;
 padding:11px 9px;color:#68636a;font:500 13px var(--body);border-radius:0;min-height:42px}
.sidebar nav button span{line-height:1.25}
.sidebar nav button:hover{color:var(--purple);background:#ede9e3}
.sidebar nav button.active{color:var(--purple-ink);font-weight:700;background:transparent}
.sidebar nav button.active:before{content:'';position:absolute;left:-18px;top:8px;bottom:8px;width:3px;background:var(--purple)}
.genres-label{margin-top:35px;padding-top:20px;border-top:1px solid var(--line)}
.sidebar nav[aria-label="Quick genres"] button{padding-block:9px;font-size:12px;color:#6f6b72;min-height:36px}
.sidebar-bottom{margin-top:auto}
.sidebar-tip{border:1px solid #dbd3c8;background:#f0eae3;padding:16px 15px 14px;margin:18px 0 20px;position:relative}
.sidebar-tip:before{content:'“';display:block;font:40px/.6 var(--display);color:#9d8f7d}
.sidebar-tip span{font:500 10px var(--mono);letter-spacing:1px;color:#746856}
.sidebar-tip p{font:400 18px/1.25 var(--display);margin:11px 0 0;color:#403b35}
.side-account{width:100%;display:flex;align-items:center;gap:10px;background:transparent;border:0;border-top:1px solid var(--line);text-align:left;padding:17px 5px 4px}
.side-account strong,.side-account small{display:block}.side-account strong{font-size:12px}.side-account small{font-size:11px;color:var(--muted)}
.side-account>span:last-child{margin-left:auto;color:var(--muted)}
.avatar{background:var(--lav);display:grid;place-items:center;flex:0 0 36px;height:36px;border-radius:50%;font-weight:700;color:var(--purple)}
.app{width:calc(100% - 238px);min-width:0}
.topbar{min-height:79px;padding:0 clamp(22px,4.3vw,72px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;background:var(--canvas)}
.search-wrap{flex:1;max-width:565px;display:flex;align-items:center;position:relative}
.search-wrap>span{font-size:23px;color:#706b74;position:absolute;left:14px;top:50%;transform:translateY(-53%)}
.search-wrap input{width:100%;height:44px;padding:0 49px 0 42px;border:1px solid var(--line-strong);border-radius:2px;background:transparent;color:var(--ink);font-size:13px}
.search-wrap input::placeholder{color:#7a7580}
.search-wrap input:focus{outline:1px solid var(--purple);background:white}
.search-wrap kbd{position:absolute;right:15px;font:11px var(--mono);color:#8c8792}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:9px}
.icon-btn{width:40px;height:40px;border:1px solid transparent;background:transparent;color:var(--purple);font-size:21px;border-radius:50%}
.icon-btn:hover{background:var(--lav)}
.auth-button,.primary-btn{border:1px solid var(--purple);background:var(--purple);color:#fff;font-weight:650;font-size:13px;letter-spacing:.05px;padding:11px 18px;border-radius:2px;transition:background .18s,color .18s}
.auth-button:hover,.primary-btn:hover{background:var(--purple-ink);color:white}
.secondary-btn{background:transparent;border:1px solid #b9b0bb;padding:11px 18px;border-radius:2px;font-weight:600;font-size:13px;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.secondary-btn:hover{border-color:var(--purple);color:var(--purple)}
.mobile-menu{display:none;background:none;border:0;font-size:24px}
main{max-width:1470px;min-height:calc(100vh - 138px);margin:0 auto;padding:36px clamp(22px,4.3vw,72px) 72px}
footer{padding:25px clamp(22px,4.3vw,72px);border-top:1px solid var(--line);color:var(--muted);font-size:11px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
footer span{font:22px var(--display);color:var(--purple)}footer button{border:0;background:none;text-decoration:underline;margin-left:auto;color:var(--purple);font-size:11px}
.intro-label,.edition-label{font:500 10px/1.5 var(--mono);letter-spacing:1.8px;color:var(--purple);text-transform:uppercase}
.section-head{display:flex;align-items:end;justify-content:space-between;border-top:1px solid var(--line-strong);margin:46px 0 22px;padding-top:20px;gap:18px}
.section-head h2{font:400 clamp(28px,2.7vw,36px)/1.1 var(--display);letter-spacing:-.9px;margin:0}
.section-head p{margin:7px 0 0;color:var(--sub);font-size:13px}
.page-title{font:400 clamp(43px,5vw,67px)/.99 var(--display);letter-spacing:-2px;margin:14px 0 14px}
.subtitle{font-size:14px;color:var(--sub);margin:0 0 25px;line-height:1.6}
.link-btn{border:0;background:transparent;color:var(--purple);padding:8px 0;border-bottom:1px solid var(--purple);white-space:nowrap;font-weight:600;font-size:12px}
.link-btn:hover{color:var(--ink);border-color:var(--ink)}
/* The opening spread is an editorial composition, not a generic landing card. */
.hero{min-height:390px;display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,37%);background:#eef0f1;
 border:1px solid #dbe1e5;position:relative;overflow:hidden;margin-bottom:26px}
.hero:after{content:'N. / READING ROOM';position:absolute;right:20px;top:18px;letter-spacing:2px;font:10px var(--mono);color:#757682}
.hero-copy{z-index:1;padding:clamp(29px,4.5vw,61px) 15px clamp(31px,4.5vw,57px) clamp(28px,4.7vw,64px)}
.hero h1{font:400 clamp(47px,5.7vw,78px)/.99 var(--display);letter-spacing:-2.8px;margin:20px 0 19px;max-width:675px;color:var(--ink)}
.hero h1 em{font-weight:400;font-style:italic;color:var(--purple)}
.hero p{font-size:14px;line-height:1.75;max-width:440px;color:#565664;margin:0 0 26px}
.hero-actions{display:flex;align-items:center;flex-wrap:wrap;gap:11px}
.hero-art{display:flex;align-items:center;justify-content:center;padding:58px 36px 34px 5px;position:relative;min-width:0}
.hero-art:before{content:'';position:absolute;background:#d6c9e4;border-radius:50%;height:260px;width:260px;right:10%;top:18%;opacity:.64}
.hero-art:after{content:'A GOOD BOOK IS ALWAYS A BEGINNING';position:absolute;bottom:21px;right:24px;font:9px var(--mono);letter-spacing:1.2px;color:#6d6a70;white-space:nowrap}
.hero-art .hero-book {position:relative;z-index:1;width:min(78%,235px);transform:rotate(7deg);filter:drop-shadow(10px 21px 12px rgba(39,36,45,.22));border:4px solid #eee7de;background:#fdfbf6;box-shadow:0 3px 0 #9c8f8d;aspect-ratio:2/3;object-fit:cover}
.hero-art .hero-placeholder{position:relative;z-index:1;transform:rotate(7deg);display:grid;place-items:center;width:75%;aspect-ratio:2/3;text-align:center;padding:25px;background:#ddc6b7;color:#463532;font:italic 32px var(--display);box-shadow:15px 23px 25px #41392c33}
.hero-book-credit{position:absolute;z-index:3;left:0;bottom:30px;background:#f8f5f0e8;padding:10px 13px;max-width:175px;line-height:1.25;box-shadow:var(--shadow)}
.hero-book-credit b,.hero-book-credit small{display:block}.hero-book-credit b{font:400 14px var(--display)}.hero-book-credit small{font:9px var(--mono);margin-top:5px;color:#74717a}
.stat-strip{display:flex;align-items:stretch;gap:0;border-block:1px solid var(--line);margin:29px 0 41px}
.stat-strip>div{display:flex;flex:1;min-width:0;gap:12px;align-items:center;padding:15px 25px;border-right:1px solid var(--line)}
.stat-strip>div:first-child{padding-left:0}.stat-strip>div:last-child{border-right:0}
.stat-strip strong{font:400 33px/1 var(--display);color:var(--ink);white-space:nowrap}
.stat-strip span{font-size:11px;color:var(--muted);line-height:1.3;max-width:110px}
.book-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:28px 19px;align-items:start}
.book-card{min-width:0;cursor:pointer;position:relative}
.book-card:focus-visible{outline-offset:5px}
.book-cover{position:relative;aspect-ratio:2/3.04;display:flex;align-items:center;justify-content:center;background:#e2ded8;
 overflow:hidden;border-radius:1px;box-shadow:5px 7px 13px rgba(24,22,27,.13);max-width:240px;transition:transform .19s ease,box-shadow .19s ease}
.book-card:hover .book-cover{transform:translateY(-5px);box-shadow:7px 13px 20px rgba(24,22,27,.17)}
.book-cover img{width:100%;height:100%;object-fit:cover}
.book-cover .placeholder{font:400 22px/1.15 var(--display);color:#5e5864;text-align:center;padding:16px;overflow-wrap:anywhere}
.book-cover .placeholder[hidden]{display:none}
.cover-chip{position:absolute;left:0;bottom:0;background:#f6f3e9ed;color:#473c57;border:0;font:500 8px var(--mono);letter-spacing:.6px;padding:6px 8px}
.card-line{display:flex;align-items:start;gap:5px;margin:13px 0 3px}
.book-card h3{font:600 13px/1.4 var(--body);margin:0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;min-height:18px;letter-spacing:-.15px}
.mini-heart{margin-left:auto;color:var(--copper)}.author{font:12px/1.5 var(--body);color:var(--sub);white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.book-card .rating{font:10px/1.5 var(--mono);color:#756a68;margin-top:8px}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin:23px 0}
.pill{background:transparent;border:1px solid var(--line-strong);border-radius:2px;color:var(--sub);padding:8px 12px;font-size:12px}
.pill.active,.pill:hover{background:var(--lav);border-color:#cfc4e9;color:var(--purple-ink)}
.mood-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mood{background:var(--canvas);border:1px solid var(--line);min-height:120px;text-align:left;padding:18px 20px;display:flex;flex-direction:column;align-items:start;justify-content:space-between}
.mood:nth-child(3n+1){background:#eeeaf2}.mood:nth-child(3n+2){background:#eaf0f2}.mood:nth-child(3n+3){background:#f2eae2}
.mood span{display:none}.mood strong{font:400 26px/1.05 var(--display)}.mood small{color:var(--purple);font-size:11px}.mood:hover{border-color:#9f8dbd}
.filter-bar{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;padding:13px 0;border-block:1px solid var(--line)}
.filter-bar select,.shelf-controls select{background:var(--canvas);border:1px solid var(--line-strong);border-radius:2px;padding:9px 12px;max-width:100%;font-size:12px;color:var(--ink)}
.compact{padding:8px 12px;font-size:12px}
.genre-search{max-width:480px;position:relative;margin:28px 0 19px}.genre-search span{position:absolute;left:13px;top:7px;font-size:23px;color:var(--muted)}
.genre-search input{width:100%;height:47px;background:var(--canvas);border:1px solid var(--line-strong);padding:10px 13px 10px 40px;border-radius:2px;outline:0}
.genre-group{margin:30px 0}.genre-group .section-head{margin:0 0 17px;border-color:var(--line)}
.genre-tags{display:flex;flex-wrap:wrap;gap:8px}
.genre-tags button{background:var(--canvas);border:1px solid var(--line);padding:9px 11px;border-radius:1px;font-size:12px;color:var(--ink);text-align:left}
.genre-tags button:hover{border-color:var(--purple);background:var(--lav)}.genre-tags span{padding-left:10px;color:var(--purple)}
.empty{padding:50px 24px;border:1px dashed var(--line-strong);text-align:center;background:var(--canvas)}
.empty h3{font:400 31px/1.15 var(--display);margin:0 0 12px}.empty p{color:var(--sub)}
.loading{padding:36px 0;text-align:center;font:italic 21px var(--display);color:var(--sub)}
.alert{background:#edeaf3;border-left:2px solid var(--purple);padding:14px 17px;margin:20px 0;font-size:13px;color:var(--purple-ink)}.alert button{margin-left:7px}
.shelf-stats{margin-top:26px}.shelf-grid{margin-top:25px}
.shelf-item{min-width:0}.shelf-controls{display:flex;gap:4px;margin:12px 0;align-items:center}.shelf-controls select{min-width:0;width:100%;font-size:11px;padding:8px}.shelf-controls button{background:transparent;border:1px solid var(--line);padding:7px 10px;color:var(--sub)}
.history-list{border-top:1px solid var(--line);margin-top:28px}
.history-row{border:0;border-bottom:1px solid var(--line);background:none;display:grid;grid-template-columns:46px 1fr auto;gap:15px;align-items:center;width:100%;text-align:left;padding:13px 5px}
.history-row:hover{background:#f0ede9}.history-row>span:first-child{width:39px;height:57px;background:#e4ded8;display:grid;place-items:center;overflow:hidden}.history-row img{height:100%;width:100%;object-fit:cover}
.history-row strong{display:block;font:500 16px var(--display)}.history-row small{color:var(--muted);font-size:11px;display:block}
.detail-back{background:none;border:0;color:var(--purple);padding:0 0 20px;font-size:12px;font-weight:600}
.detail-hero{display:grid;grid-template-columns:minmax(165px,26%) 1fr;gap:clamp(26px,5vw,70px);border-top:1px solid var(--line);padding:30px 0 12px}
.detail-hero>.book-cover{width:100%;max-width:300px;align-self:start}
.detail-info h1{font:400 clamp(39px,4.7vw,67px)/1.03 var(--display);letter-spacing:-2px;margin:16px 0 8px}.byline{color:var(--sub);font-size:17px;margin:0 0 20px}
.meta{display:flex;gap:15px;flex-wrap:wrap;font:10px var(--mono);color:#655d65;padding:16px 0;margin:14px 0;border-block:1px solid var(--line)}
.description{font:400 17px/1.7 var(--display);max-width:730px;white-space:pre-line}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin:23px 0 15px}
.legal{display:block;color:var(--muted);font-size:11px;line-height:1.55;max-width:600px}
.subjects{margin:32px 0}.subjects strong{font:500 11px var(--mono);letter-spacing:.7px}.subjects .pill-row{margin:13px 0}
.review-layout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.review{padding:24px;background:var(--canvas);border:1px solid var(--line);min-width:0}
.review header{display:flex;justify-content:space-between;gap:12px}.review strong{font-size:13px}.review p{font-size:13px;color:var(--sub)}.review textarea,.review select{width:100%;background:white;border:1px solid var(--line-strong);padding:10px;border-radius:2px}
.review-layout>.empty{min-width:0}.review-layout>.loading{grid-column:1/-1}
.overlay{position:fixed;inset:0;background:rgba(27,24,33,.55);z-index:100;display:grid;place-items:center;padding:15px}
.hidden{display:none!important}
.modal{position:relative;background:var(--canvas);width:min(100%,460px);max-height:92vh;overflow:auto;padding:39px clamp(21px,5vw,42px);border:1px solid var(--line);box-shadow:0 30px 90px #201a2940}
.close-modal{position:absolute;right:13px;top:12px;border:0;background:none;color:var(--muted);font-size:28px}
.modal h2{font:400 41px/1 var(--display);letter-spacing:-.9px;margin:13px 0}.modal p{color:var(--sub);font-size:13px}
.auth-tabs{display:flex;border-bottom:1px solid var(--line);margin:25px 0 21px;gap:25px}
.auth-tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 0;color:var(--sub);font-weight:600;font-size:12px}
.auth-tabs button.active{color:var(--purple);border-color:var(--purple)}
.field{margin:15px 0}.field label{display:block;margin-bottom:6px;font-size:12px;font-weight:600}.field input,.field textarea,.field select{width:100%;background:white;border:1px solid var(--line-strong);padding:12px;border-radius:2px;font-size:13px}
.form-msg{font-size:12px!important;color:var(--purple)}.toast{position:fixed;right:20px;bottom:18px;z-index:250;background:#312c3b;color:white;padding:13px 18px;box-shadow:var(--shadow);font-size:12px;max-width:min(92vw,390px)}
.reader{position:fixed;inset:0;z-index:150;background:#f4f0e8;display:flex;flex-direction:column}
.reader-bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;min-height:69px;padding:10px clamp(12px,3.5vw,48px);background:#fbf9f4;border-bottom:1px solid #ddd5c9}
.reader-bar strong{font:400 18px var(--display);margin-right:auto;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reader-bar button,.reader-bar select{background:transparent;border:1px solid #c9bfb2;padding:8px 11px;font-size:12px}
.reader-meter{height:3px;background:#ddd7ca}.reader-meter span{height:100%;display:block;width:0;background:var(--purple)}
.reader-content{flex:1;overflow:auto;padding:clamp(23px,5vw,65px) max(23px,calc((100% - 760px)/2));white-space:pre-wrap;line-height:1.8;font:18px/1.85 Georgia,serif;overflow-wrap:anywhere}
.reader-content.sepia{background:#f6f0e5;color:#342e2a}.reader-content.light{background:#fff;color:#292929}.reader-content.dark{background:#24242b;color:#eee9e6}
body.dark-mode{--paper:#211f25;--canvas:#27252c;--white:#2b2930;--ink:#f0ece8;--sub:#c8c0c6;--muted:#aaa3a9;--line:#454049;--line-strong:#675f67;--lav:#3e394c;--purple:#c0b0ec;--purple-ink:#d8ccf4;--blue:#303843;--accent:#445767;--copper:#dbab82;--shadow:0 13px 33px #0002}
body.dark-mode .sidebar,body.dark-mode .topbar{background:#25232a}
body.dark-mode .hero{background:#30363b;border-color:#47525c}
body.dark-mode .hero h1,body.dark-mode .hero p{color:var(--ink)}
body.dark-mode .hero-art:before{background:#554960}
body.dark-mode .hero-book-credit{background:#35313a;color:#fff}
body.dark-mode .mood{background:#36313c;color:var(--ink)}
body.dark-mode .genre-tags button,body.dark-mode .empty,body.dark-mode .review,body.dark-mode .modal,body.dark-mode .field input,body.dark-mode .field textarea{background:var(--canvas);color:var(--ink)}

// Shuffle genre order only once per cycle; persist across refreshes on this device.
function nvShuffle(array){const a=[...array];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nvGenreCycle(name){
 let value=getLocal(name,null);
 if(!value||!Array.isArray(value.order)||value.order.length!==allGenres.length){value={order:nvShuffle(allGenres),index:0}}
 if(value.index>=value.order.length){value={order:nvShuffle(allGenres),index:0}}
 return value;
}
function nvNextGenres(name,count){const q=nvGenreCycle(name);const picked=[];
 for(let i=0;i<count;i++){
  if(q.index>=q.order.length){q.order=nvShuffle(allGenres);q.index=0}
  picked.push(q.order[q.index++]);
 }
 putLocal(name,q);return picked;
}
function nvWorkFingerprint(b){return normTitle(b.title)+'|'+normAuthor(b.author)}
function nvDistinct(books){const seen=new Set();return books.filter(b=>{if(!b?.title)return false;const k=nvWorkFingerprint(b);if(seen.has(k))return false;seen.add(k);return true})}
function nvNewFromPool(pool,history,count){let used=new Set(history);let fresh=nvDistinct(pool).filter(b=>!used.has(nvWorkFingerprint(b)));
 return nvShuffle(fresh).slice(0,count)
}
async function refreshHomePicks(){
 const token=++homeRefreshId;homeRefreshPending=true;
 const refresh=$('#nv-refresh-picks');if(refresh){refresh.disabled=true;refresh.textContent='Curating…'}
 const genres=nvNextGenres('home-genre-cycle',4);
 // One search combines rotating genres, respecting Open Library's default 1 request/second guidance.
 const query=genres.map(g=>'subject:"'+g.replace(/"/g,'')+'"').join(' OR ');
 let candidates=[];
 try{const response=await getOL(query,1,36);candidates=nvDistinct(response.items);}catch{}
 if(token!==homeRefreshId)return;
 const prior=getLocal('home-books-seen',[]);
 let chosen=nvNewFromPool(candidates,prior,10);
 if(chosen.length<10){chosen=[...chosen,...nvNewFromPool(candidates,chosen.map(nvWorkFingerprint),10-chosen.length).filter(b=>!chosen.some(c=>nvWorkFingerprint(c)===nvWorkFingerprint(b)))].slice(0,10)}
 if(chosen.length){featured=chosen;putLocal('home-books-seen',[...prior,...chosen.map(nvWorkFingerprint)].slice(-500));}
 homeRefreshPending=false;
 if(screen==='home'){
  const list=$('#nv-home-picks');if(list)list.innerHTML=grid((featured.length?featured:seed).slice(0,10));

 }
}

 try{
  for(let attempt=0;attempt<5;attempt++){
   const genre=nvNextGenres('surprise-genre-cycle',1)[0];
   const pageToTry=1+Math.floor(Math.random()*3);
   let found=[];
   try{const response=await getOL('subject:"'+genre.replace(/"/g,'')+'"',pageToTry,24);found=response.items;if(!found.length&&pageToTry!==1)found=(await getOL('subject:"'+genre.replace(/"/g,'')+'"',1,24)).items;}catch{}
   const unseen=nvShuffle(nvDistinct(found)).find(b=>!used.has(nvWorkFingerprint(b)));
   if(unseen){putLocal('surprise-seen',[...seen,nvWorkFingerprint(unseen)]);await showBook(id(unseen));notify('An unseen pick from '+genre);return}

 }finally{surpriseBusy=false;button.disabled=false;button.innerHTML=old}
}

const readerSourcePending=new Map();
const GITENBERG_API='https://api.github.com';
async function gitJSON(path){

  try{
    const res=await fetch(GITENBERG_API+path, {signal:controller.signal,headers:{Accept:'application/vnd.github+json'}});
    if(res.status===403||res.status===429)throw Error('The free ebook source is busy or rate limited. Please try again later.');

    return await res.json();
  } finally {clearTimeout(timer)}
}
async function discoverGitText(b){
  if(b?.source!=='gutenberg'||!/^\d{1,7}$/.test(String(b.id)))return null;
  const id=String(b.id);
  if(Object.hasOwn(CURATED_TEXTS,id))return CURATED_TEXTS[id];
  const memo=getLocal('text-source:'+id,null);
  if(memo?.url && /^https:\/\/raw\.githubusercontent\.com\/GITenberg\//.test(memo.url))return memo.url;
  // A short-lived negative result avoids repeating failed searches on each visit.
  if(memo?.miss && Date.now()-memo.when<2*60*60*1000)return null;
  if(readerSourcePending.has(id))return readerSourcePending.get(id);
  const lookup=(async()=>{
    // Never scrape Gutenberg's live book files. GITenberg is a separate GitHub archive.
    const qs=new URLSearchParams({q:'org:GITenberg '+id+' in:name',per_page:'20'});
    const result=await gitJSON('/search/repositories?'+qs.toString());
    const repo=(result.items||[]).find(r=>r?.full_name?.startsWith('GITenberg/')&&r.name.endsWith('_'+id));
    if(!repo){putLocal('text-source:'+id,{miss:true,when:Date.now()});return null}
    const entries=await gitJSON('/repos/'+encodeURIComponent(repo.owner.login)+'/'+encodeURIComponent(repo.name)+'/contents');
    if(!Array.isArray(entries))return null;
    // Prefer well-formed plain UTF-8 book files at the repository root.
    const files=entries.filter(f=>f.type==='file'&&/\.txt$/i.test(f.name)&&!/(license|readme|contribut|metadata)/i.test(f.name)&&f.size>=3000&&f.size<=8*1024*1024);

      const score=f=>(f.name===id+'-0.txt'?0:f.name===id+'.txt'?1:f.name.startsWith(id)?2:3);
      return score(a)-score(b);
    })[0];
    const target=file?.download_url;
    if(!target||!/^https:\/\/raw\.githubusercontent\.com\/GITenberg\//.test(target)){
      putLocal('text-source:'+id,{miss:true,when:Date.now()});return null;
    }
    putLocal('text-source:'+id,{url:target,when:Date.now()});
    return target;
  })().finally(()=>readerSourcePending.delete(id));
  readerSourcePending.set(id,lookup);
  return lookup;
}

   const term='title:"'+String(b.title).replace(/"/g,'')+'"';

     const authors=(b.author||'').split(/[;,]/)[0].trim();
     const authorMatch=!authors||!x.author||clean(x.author).includes(clean(authors).split(' ')[0]);

   }

async function authSubmit(e){

 if(!db){msg.textContent='Account service unavailable';return}
 const btn=form.querySelector('button[type=submit],button.primary-btn');if(!btn)return;
 btn.disabled=true;msg.textContent='Please wait…';const f=new FormData(form);
 const email=String(f.get('email')||'').trim(),password=String(f.get('password')||'');
 try{
  let r;
  if(authMode==='signup'){
   const name=String(f.get('name')||'').trim();
   if(name.length<2||!f.get('agreement'))throw Error('Enter a name and accept the registration notice.');
   r=await db.auth.signUp({email,password,options:{data:{name,novella_registration_requested:true},emailRedirectTo:location.origin+location.pathname}});
  }else if(authMode==='forgot')r=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  else if(authMode==='new-password')r=await db.auth.updateUser({password});
  else r=await db.auth.signInWithPassword({email,password});
  if(r.error)throw r.error;
  msg.style.color='#43876b';
  msg.textContent=authMode==='signup'?'Registration started. Confirm your email if asked, then sign in.':authMode==='forgot'?'If that email is registered, check your inbox.':authMode==='new-password'?'Password updated successfully.':'Checking registration…';
  if(authMode==='signin'){if(r.data?.user)await nvCheckRegistration(r.data.user,'email-signin')}
  else if(authMode==='new-password'){authMode='signin';closeAuth();history.replaceState({},'',location.pathname)}
  else if(authMode==='signup'&&r.data?.session?.user){await nvCheckRegistration(r.data.session.user,'email-register')}
 }catch(err){
  msg.style.color='#bb5371';
  if(authMode==='signin')msg.innerHTML='<span>Could not sign in. Check your password or register if you do not have an account.</span> <button type="button" data-auth="signup">Register instead →</button>';
  else msg.textContent=err?.message||'Unable to complete request.';
 }finally{btn.disabled=false}
}

async function initAuth(){

 try{
  const {data,error}=await db.auth.getSession();if(error)throw error;
  const intent=nvIntentTake();
  if(data?.session?.user)await nvCheckRegistration(data.session.user,intent);
  else{me=null;nvProfile=null;userUI()}
  db.auth.onAuthStateChange((event,session)=>{
   if(event==='PASSWORD_RECOVERY'){setTimeout(()=>openAuth('new-password'),0);return}
   if(event==='SIGNED_IN'){
    // Supabase callbacks must not await other Auth APIs inside the callback.
    setTimeout(()=>{
     const current=nvIntentTake();
     if(session?.user&&nvPendingGoogle?.id!==session.user.id&&(!me||me.id!==session.user.id))nvCheckRegistration(session.user,current).catch(()=>{});
    },0);
   }else if(event==='SIGNED_OUT')setTimeout(()=>{if(!nvPendingGoogle&&!me){nvProfile=null;userUI()}},0);
  });
  if(location.hash.includes('type=recovery')){recoveryMode=true;openAuth('new-password')}
 }catch{me=null;nvProfile=null;userUI();notify('Account service temporarily unavailable. Guest browsing still works.')}
}

// V9.2: contextual book-name hints, multiple alternatives and an honest correction step.
// Speech recognition quality and language support ultimately depend on the browser's provider.
const nvVoiceReview=$('#nv-voice-review');
const nvVoiceLangKey='voice-language';
const nvVoiceLanguages={'en-IN':'English (India)','en-US':'English (US)','en-GB':'English (UK)'};
let nvVoiceLanguage=getLocal(nvVoiceLangKey,'en-IN');
if(!nvVoiceLanguages[nvVoiceLanguage])nvVoiceLanguage='en-IN';
let nvVoiceSession=null;
let nvVoiceNoticeTimer=null;
const nvVoiceNormalize=s=>String(s||'').replace(/^(?:please\s+)?(?:search\s+for|find\s+(?:me\s+)?|show\s+me|look\s+up)\s+/i,'').replace(/\s+/g,' ').trim().slice(0,110);
const nvVoiceCompare=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
function nvVoiceDistance(a,b){
 const dp=Array.from({length:b.length+1},(_,i)=>i);
 for(let i=1;i<=a.length;i++){
  let last=dp[0];dp[0]=i;
  for(let j=1;j<=b.length;j++){
   const old=dp[j];dp[j]=Math.min(dp[j]+1,dp[j-1]+1,last+(a[i-1]===b[j-1]?0:1));last=old;
  }
 }
 return dp[b.length];
}
function nvVoiceTerms(){
 const books=[...seed,...featured,...classics,...results,...bookMap.values()];
 const terms=[...nvPopularQueries,...nvSearchTopics,...allGenres.slice(0,35),...nvRecent()];
 for(const b of books){if(b?.title)terms.push(b.title);if(b?.author&&b.author!=='Unknown author')terms.push(b.author)}
 return [...new Set(terms.map(x=>String(x||'').trim()).filter(x=>x.length>=4&&x.length<80))].slice(0,140);
}
function nvVoiceClosest(raw){
 const normalized=nvVoiceCompare(raw);
 if(!normalized||normalized.length<4)return null;
 // Common pronunciation-based errors; always offered as a suggestion, never forced.
 const aliases={'icky guy':'Ikigai','icky gay':'Ikigai','ikiguy':'Ikigai','pride and prejudiced':'Pride and Prejudice','pride in prejudice':'Pride and Prejudice','huckle berry fin':'Huckleberry Finn','huckleberry fin':'Huckleberry Finn','alice in wonder land':'Alice in Wonderland','the alchemist paulo coelho':'The Alchemist'};
 if(aliases[normalized])return {text:aliases[normalized],score:.9};
 let best=null;
 for(const term of nvVoiceTerms()){
  const wanted=nvVoiceCompare(term);
  if(!wanted||Math.abs(wanted.length-normalized.length)>Math.max(4,normalized.length*.27))continue;
  const ratio=1-nvVoiceDistance(normalized,wanted)/Math.max(wanted.length,normalized.length);
  if(ratio>=.83&&(!best||ratio>best.score))best={text:term,score:ratio};
 }
 return best;
}

function nvVoiceReviewResult(values,hint='Check what Novella heard before searching.'){
 const possibilities=[...new Set(values.map(nvVoiceNormalize).filter(Boolean))].slice(0,5);
 const first=possibilities[0]||'';
 // Only show the large editable review when we actually have a recognized phrase.
 if(!first){nvVoiceHideReview();nvVoiceNotice(hint);return}
 const closest=nvVoiceClosest(first);
 const choices=[...new Set([...(closest&&closest.score>=.86?[closest.text]:[]),...possibilities.slice(1)])]
  .filter(s=>nvVoiceCompare(s)!==nvVoiceCompare(first)).slice(0,4);
 const options=Object.entries(nvVoiceLanguages).map(([value,label])=>`<option value="${value}" ${value===nvVoiceLanguage?'selected':''}>${label}</option>`).join('');
 nvVoiceReview.innerHTML=`<div class="nv-vr-label">VOICE SEARCH</div>
  <p class="nv-vr-hint">${esc(hint)}</p>
  <label class="nv-vr-label" for="nv-voice-corrected" style="display:block;margin-top:11px">WHAT I HEARD</label>
  <input class="nv-vr-input" id="nv-voice-corrected" type="text" value="${esc(first)}" maxlength="110" autocomplete="off" placeholder="Book title, author, or genre">
  ${choices.length?`<div class="nv-vr-label" style="margin-top:12px">DID YOU MEAN</div><div class="nv-vr-alternatives">${choices.map(x=>`<button type="button" data-voice-option="${esc(x)}">${esc(x)}</button>`).join('')}</div>`:''}
  <div class="nv-vr-actions"><button class="nv-vr-confirm" type="button" data-voice-confirm>Search books →</button><button type="button" data-voice-again>Speak again</button><button type="button" data-voice-cancel>Cancel</button></div>
  <div class="nv-vr-foot"><label for="nv-voice-language">Speech language</label><select id="nv-voice-language">${options}</select></div>`;
 nvVoiceReview.hidden=false;$('#nv-voice-corrected').focus();
}

// V9.6: Auto-finish after speech silence; Cloudflare transcription, not browser SpeechRecognition.
// Audio leaves the device only after a deliberate mic click; no voice recordings are stored.
// Use noise-calibrated voice activity detection (VAD) instead of one fixed volume cutoff.
// Short transient noises cannot start a search: speech must persist for 170ms.
// We measure audio-frame time so background-tab throttling does not confuse silence duration.
function nvVoiceVadStep(v, rms, blockMs) {
 v.elapsedMs += blockMs;
 if(v.elapsedMs <= 140){v.calibration.push(Math.min(.05,Math.max(0,rms)));return 'calibrating'}
 if(!v.calibrated){
  const sorted=[...v.calibration].sort((a,b)=>a-b);
  v.noise=Math.max(.001,Math.min(.025,sorted[Math.floor(sorted.length*.25)]||.003));
  v.calibrated=true;
 }
 // Calibrated against the current room, with gradual noise tracking before speech.
 const threshold=Math.max(.004,Math.min(.055,v.noise*1.85+.0018));
 if(!v.heard){
  if(rms>threshold)v.strongMs+=blockMs;
  else v.strongMs=Math.max(0,v.strongMs-blockMs*1.4);
  if(v.strongMs>=145){
   v.heard=true;v.startSpeechMs=Math.max(0,v.elapsedMs-v.strongMs-320);
   v.lastSpeechMs=v.elapsedMs;return 'started';
  }
  if(rms<threshold)v.noise=v.noise*.995+rms*.005;
  if(v.elapsedMs>=6000)return 'empty';
 }else{
  // Adapt to quiet consonants: do not end during short natural pauses.
  if(rms>Math.max(.0035,threshold*.70,v.noise*1.20))v.lastSpeechMs=v.elapsedMs;
  const pause=v.elapsedMs-v.lastSpeechMs;
  if(pause>=850)return 'end';
 }
 if(v.elapsedMs>=10000)return v.heard?'end':'empty';
 return 'listening';
}
function nvVoiceNewVad(){return {elapsedMs:0,calibration:[],calibrated:false,noise:.003,heard:false,strongMs:0,lastSpeechMs:0,startSpeechMs:0}}
function nvVoiceProcessing(){
 const mic=$('#nv-search-voice');
 mic.classList.remove('nv-listening');mic.classList.add('nv-processing');
 mic.setAttribute('aria-pressed','false');mic.setAttribute('aria-label','Transcribing voice query');
 const bar=$('#nv-voice-status');bar.classList.remove('nv-voice-hint');bar.hidden=false;
 $('#nv-voice-message').textContent='Searching..';
}
function nvVoiceWav(chunks,frames,sampleRate,vad){
 // Trim leading idle time, retain ~320ms leading and ~380ms trailing context.
 if(frames<1||!sampleRate)return null;
 const startMs=vad?.heard?Math.max(0,vad.startSpeechMs||0):0;
 const endMs=vad?.heard?Math.min(frames*1000/sampleRate,(vad.lastSpeechMs||0)+380):frames*1000/sampleRate;
 const first=Math.max(0,Math.floor(startMs*sampleRate/1000));
 const last=Math.min(frames,Math.ceil(endMs*sampleRate/1000));
 if(last-first<sampleRate*.4)return null;
 const input=new Float32Array(last-first);
 let i=0,at=0;
 for(const chunk of chunks){
  const a=Math.max(0,first-at),b=Math.min(chunk.length,last-at);
  if(b>a){input.set(chunk.subarray(a,b),i);i+=b-a}
  at+=chunk.length;if(at>=last)break;
 }
 const rate=16000,outputLength=Math.floor(i*rate/sampleRate);
 if(outputLength<6400||outputLength>16000*12)return null;
 const buffer=new ArrayBuffer(44+outputLength*2),view=new DataView(buffer);
 const ascii=(idx,v)=>{for(let j=0;j<v.length;j++)view.setUint8(idx+j,v.charCodeAt(j))};
 ascii(0,'RIFF');view.setUint32(4,36+outputLength*2,true);ascii(8,'WAVE');ascii(12,'fmt ');
 view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);
 view.setUint32(24,rate,true);view.setUint32(28,rate*2,true);view.setUint16(32,2,true);view.setUint16(34,16,true);
 ascii(36,'data');view.setUint32(40,outputLength*2,true);
 const ratio=sampleRate/rate;
 for(let j=0;j<outputLength;j++){
  // Area-average low-pass resampling avoids aliasing from naive linear interpolation.
  const a=j*ratio,b=Math.min((j+1)*ratio,i);
  let k=Math.floor(a),sum=0,weight=0;
  while(k<b){const w=Math.min(b,k+1)-Math.max(a,k);sum+=input[k]*w;weight+=w;k++}
  const value=Math.max(-1,Math.min(1,weight?sum/weight:0));
  view.setInt16(44+j*2,Math.round(value*32767),true);
 }
 return buffer;
}
function nvVoiceStopHardware(s){
 clearTimeout(s.timer);
 try{s.processor?.disconnect()}catch{}
 try{s.source?.disconnect()}catch{}
 try{s.gain?.disconnect()}catch{}
 try{s.stream?.getTracks().forEach(t=>t.stop())}catch{}
 try{s.context?.close().catch(()=>{})}catch{}
}
async function nvVoiceFinishCapture(s){
 if(nvVoiceSession!==s||s.finished||s.processing)return;
 s.processing=true;nvVoiceStopHardware(s);
 if(s.cancelled)return;
 if(!s.vad.heard||s.frames<8000){nvVoiceCancelActive();nvVoiceNotice('No clear speech. Try again.');return}
 const audio=nvVoiceWav(s.chunks,s.frames,s.sampleRate,s.vad);
 const startedAt=performance.now();
 if(!audio){nvVoiceCancelActive();nvVoiceNotice('Recording failed. Try again.');return}
 nvVoiceProcessing();
 const abort=new AbortController();s.abort=abort;
 s.timer=setTimeout(()=>abort.abort(),25000);
 try{
  // The request is same-origin on Cloudflare Pages. No public API key is exposed.
  const response=await fetch('/api/voice',{method:'POST',headers:{'Content-Type':'audio/wav'},body:audio,signal:abort.signal,cache:'no-store'});
  let data;try{data=await response.json()}catch{data=null}
  if(!response.ok)throw Error(data?.error||'Voice service unavailable ('+response.status+')');
  if(new URLSearchParams(location.search).has('voice_debug'))console.info('Novella voice latency (ms):',Math.round(performance.now()-startedAt));
  const heard=nvVoiceNormalize(data?.text||'');
  if(nvVoiceSession!==s||s.cancelled)return;
  nvVoiceCancelActive();
  if(!heard){nvVoiceNotice('Couldn’t understand. Try again.');return}
  // V9.5: like a voice-search button, search immediately after the person finishes.
  // Very close title matches are corrected; unknown queries still search normally.
  if(!/[\p{L}\p{N}]{2,}/u.test(heard)||/^(um|uh|hmm|ah|you|the)$/i.test(heard)){
   nvVoiceNotice('No clear title heard. Try again.');return;
  }
  const match=nvVoiceClosest(heard);
  const query=match&&match.score>=.90?match.text:heard;
  quickSearch(query);
 }catch(e){
  if(nvVoiceSession!==s||s.cancelled)return;
  nvVoiceCancelActive();
  const msg=e?.name==='AbortError'?'Voice timed out. Retry.':
   (/not configured|not enabled|unavailable|not found|404|429/i.test(String(e.message))?
    'Voice service offline. Check /api/voice.':'Voice failed. Please retry.');
  nvVoiceNotice(msg);
 }
}
async function nvVoiceStart(){
 if(nvVoiceSession){
  const s=nvVoiceSession;
  if(s.processing)return;
  // Backup: tap again when the room is too noisy for automatic silence detection.
  nvVoiceFinishCapture(s);return;
 }
 nvVoiceHideReview();closeSuggest();
 if(!navigator.mediaDevices?.getUserMedia||!(window.AudioContext||window.webkitAudioContext)){
  nvVoiceNotice('Microphone unavailable. Try typing.');return;
 }
 const s={cancelled:false,finished:false,processing:false,stream:null,context:null,source:null,processor:null,gain:null,chunks:[],frames:0,sampleRate:48000,timer:null,finishTimer:null,abort:null,vad:nvVoiceNewVad()};
 nvVoiceSession=s;
 nvVoiceListening();
 try{
  s.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});
  if(nvVoiceSession!==s||s.cancelled){s.stream.getTracks().forEach(t=>t.stop());return}
  const Audio=window.AudioContext||window.webkitAudioContext;
  s.context=new Audio();s.sampleRate=s.context.sampleRate;
  if(s.context.state==='suspended')await s.context.resume();
  if(nvVoiceSession!==s||s.cancelled){nvVoiceStopHardware(s);return}
  s.source=s.context.createMediaStreamSource(s.stream);
  s.processor=s.context.createScriptProcessor(1024,1,1);
  s.gain=s.context.createGain();s.gain.gain.value=0;
  s.processor.onaudioprocess=event=>{
   if(nvVoiceSession!==s||s.processing||s.cancelled)return;
   const data=event.inputBuffer.getChannelData(0);
   s.chunks.push(new Float32Array(data));s.frames+=data.length;
   let power=0,count=0;
   for(let i=0;i<data.length;i+=8){power+=data[i]*data[i];count++}
   const rms=Math.sqrt(power/Math.max(1,count));
   const stage=nvVoiceVadStep(s.vad,rms,data.length/s.sampleRate*1000);
   if(stage==='started')nvVoiceListening();
   if(stage==='end')nvVoiceFinishCapture(s);
   if(stage==='empty'){
    nvVoiceCancelActive();
    nvVoiceNotice('No speech detected. Tap to try again.');
   }
  };
  s.source.connect(s.processor);s.processor.connect(s.gain);s.gain.connect(s.context.destination);
  nvVoiceListening();
  // Safety cap; protects against devices that never signal silence / suspended audio.
  s.timer=setTimeout(()=>{
   if(nvVoiceSession!==s||s.processing)return;
   if(!s.vad.heard){nvVoiceCancelActive();nvVoiceNotice('No speech detected. Try again.');}
   else nvVoiceFinishCapture(s);
  },10800);
 }catch(error){
  if(nvVoiceSession!==s||s.cancelled)return;
  const msg=['NotAllowedError','PermissionDeniedError','SecurityError'].includes(error?.name)?
   'Allow microphone in site settings.':
   error?.name==='NotFoundError'?'No microphone found.':
   'Mic could not start. Try typing.';
  nvVoiceCancelActive();nvVoiceNotice(msg);
 }
}

// Optional site-wide maintenance setting: publish maintenance.json with {"enabled":true}.
// Polling is intentionally low-frequency so GitHub Pages isn't repeatedly hammered.
const maintenanceMessages=[
 'We’re carefully editing the next chapter.',
 'A better reading room is taking shape.',
 'Even the finest libraries need a little tending.',
 'The shelves are being rearranged. Stories return soon.',
 'Good books deserve a thoughtful place to live.'
];
let maintenanceVisible=false,maintenanceTick=null,maintenancePoll=null,maintenanceLastVersion='';
function maintenanceScreen(on){
 if(on===maintenanceVisible)return;
 maintenanceVisible=on;
 const existing=$('#novella-maintenance-screen');if(existing)existing.remove();
 if(maintenanceTick){clearInterval(maintenanceTick);maintenanceTick=null;}
 if(!on)return;
 const pane=document.createElement('div');pane.id='novella-maintenance-screen';pane.setAttribute('role','status');pane.setAttribute('aria-live','polite');
 pane.innerHTML='<div class="nv-maint-brand">n. <strong>novella</strong>.</div><div class="nv-maint-inner"><span class="nv-maint-kicker">A NOTE FROM THE READING ROOM</span><h1>Good stories take<br><em>thoughtful editing.</em></h1><p>Novella is undergoing maintenance. Thank you for being part of our story.</p><div class="nv-maint-quote" id="nv-maint-quote"></div><div class="nv-maint-indicator">● &nbsp; WE’RE WORKING ON IT</div></div><small class="nv-maint-foot">THE READING ROOM · EST. 2026</small>';
 document.body.append(pane);
 let i=0;const node=$('#nv-maint-quote');node.textContent='“'+maintenanceMessages[i]+'”';
 maintenanceTick=setInterval(()=>{i=(i+1)%maintenanceMessages.length;node.classList.remove('nv-fade');void node.offsetHeight;node.classList.add('nv-fade');node.textContent='“'+maintenanceMessages[i]+'”';},6000);
}
async function pollMaintenance(){
 try{const ctl=new AbortController();const timeout=setTimeout(()=>ctl.abort(),4000);
 const response=await fetch('./maintenance.json?_='+Math.floor(Date.now()/30000),{cache:'no-store',signal:ctl.signal});clearTimeout(timeout);
 if(!response.ok){if(maintenanceVisible)maintenanceScreen(false);return}
 const data=await response.json();maintenanceScreen(data.enabled===true);
 }catch{/* Keep the last known state on temporary network failure. */}
}
pollMaintenance();maintenancePoll=setInterval(pollMaintenance,60000);
