/* NOVELLA / THE READING ROOM · editorial interface system
   Paper, ink, one indigo accent, quiet rules. No gradient-heavy UI. */
:root {
 --paper:#f8f6f2; --canvas:#fbfaf7; --white:#ffffff; --ink:#26252b;
 --sub:#56535f; --muted:#77737b; --line:#e0dcd7; --line-strong:#cbc4bd;
 --lav:#e8e4f3; --purple:#584d83; --purple-ink:#453b70;
 --blue:#e8eff3; --accent:#b8d5e3; --copper:#986444;
 --display:'Newsreader',Georgia,serif; --body:'DM Sans',Arial,sans-serif;
 --mono:'IBM Plex Mono',ui-monospace,monospace;
 --shadow:0 14px 35px rgba(29,26,38,.055);
}
* {box-sizing:border-box}
html{scroll-behavior:smooth}
body {margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea {font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[role=button]:focus-visible{outline:2px solid #786cb0;outline-offset:3px}
button:disabled{cursor:not-allowed;opacity:.6}
.shell{display:flex;min-height:100vh;max-width:2000px;margin:0 auto}
.sidebar {position:sticky;top:0;flex:0 0 238px;height:100vh;display:flex;flex-direction:column;
 background:#f6f3ef;border-right:1px solid var(--line);padding:27px 18px 20px;z-index:50}
.brand{font:500 33px/1 var(--display);letter-spacing:-1.5px;display:flex;align-items:center;gap:8px;padding:2px 8px 0; margin:0 0 55px;color:var(--ink)}
.brand-icon {border:1px solid var(--ink);width:29px;height:32px;display:grid;place-items:center;border-radius:50% 50% 3px 3px;font:500 21px var(--display);letter-spacing:0;transform:rotate(-7deg)}
.brand-dot{color:var(--purple)}
.side-label{font:500 10px/1.4 var(--mono);letter-spacing:1.3px;color:#726e76;padding:0 9px;margin:0 0 12px}
.sidebar nav{display:grid;gap:2px}
.sidebar nav button{position:relative;border:0;background:transparent;text-align:left;display:flex;align-items:center;gap:10px;
 padding:11px 9px;color:#68636a;font:500 13px var(--body);border-radius:0;min-height:42px}
.sidebar nav button span{line-height:1.25}
.sidebar nav button:hover{color:var(--purple);background:#ede9e3}
.sidebar nav button.active{color:var(--purple-ink);font-weight:700;background:transparent}
.sidebar nav button.active:before{content:'';position:absolute;left:-18px;top:8px;bottom:8px;width:3px;background:var(--purple)}
.genres-label{margin-top:35px;padding-top:20px;border-top:1px solid var(--line)}
.sidebar nav[aria-label="Quick genres"] button{padding-block:9px;font-size:12px;color:#6f6b72;min-height:36px}
.sidebar-bottom{margin-top:auto}
.sidebar-tip{border:1px solid #dbd3c8;background:#f0eae3;padding:16px 15px 14px;margin:18px 0 20px;position:relative}
.sidebar-tip:before{content:'“';display:block;font:40px/.6 var(--display);color:#9d8f7d}
.sidebar-tip span{font:500 10px var(--mono);letter-spacing:1px;color:#746856}
.sidebar-tip p{font:400 18px/1.25 var(--display);margin:11px 0 0;color:#403b35}
.side-account{width:100%;display:flex;align-items:center;gap:10px;background:transparent;border:0;border-top:1px solid var(--line);text-align:left;padding:17px 5px 4px}
.side-account strong,.side-account small{display:block}.side-account strong{font-size:12px}.side-account small{font-size:11px;color:var(--muted)}
.side-account>span:last-child{margin-left:auto;color:var(--muted)}
.avatar{background:var(--lav);display:grid;place-items:center;flex:0 0 36px;height:36px;border-radius:50%;font-weight:700;color:var(--purple)}
.app{width:calc(100% - 238px);min-width:0}
.topbar{min-height:79px;padding:0 clamp(22px,4.3vw,72px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;background:var(--canvas)}
.search-wrap{flex:1;max-width:565px;display:flex;align-items:center;position:relative}
.search-wrap>span{font-size:23px;color:#706b74;position:absolute;left:14px;top:50%;transform:translateY(-53%)}
.search-wrap input{width:100%;height:44px;padding:0 49px 0 42px;border:1px solid var(--line-strong);border-radius:2px;background:transparent;color:var(--ink);font-size:13px}
.search-wrap input::placeholder{color:#7a7580}
.search-wrap input:focus{outline:1px solid var(--purple);background:white}
.search-wrap kbd{position:absolute;right:15px;font:11px var(--mono);color:#8c8792}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:9px}
.icon-btn{width:40px;height:40px;border:1px solid transparent;background:transparent;color:var(--purple);font-size:21px;border-radius:50%}
.icon-btn:hover{background:var(--lav)}
.auth-button,.primary-btn{border:1px solid var(--purple);background:var(--purple);color:#fff;font-weight:650;font-size:13px;letter-spacing:.05px;padding:11px 18px;border-radius:2px;transition:background .18s,color .18s}
.auth-button:hover,.primary-btn:hover{background:var(--purple-ink);color:white}
.secondary-btn{background:transparent;border:1px solid #b9b0bb;padding:11px 18px;border-radius:2px;font-weight:600;font-size:13px;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.secondary-btn:hover{border-color:var(--purple);color:var(--purple)}
.mobile-menu{display:none;background:none;border:0;font-size:24px}
main{max-width:1470px;min-height:calc(100vh - 138px);margin:0 auto;padding:36px clamp(22px,4.3vw,72px) 72px}
footer{padding:25px clamp(22px,4.3vw,72px);border-top:1px solid var(--line);color:var(--muted);font-size:11px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
footer span{font:22px var(--display);color:var(--purple)}footer button{border:0;background:none;text-decoration:underline;margin-left:auto;color:var(--purple);font-size:11px}
.intro-label,.edition-label{font:500 10px/1.5 var(--mono);letter-spacing:1.8px;color:var(--purple);text-transform:uppercase}
.section-head{display:flex;align-items:end;justify-content:space-between;border-top:1px solid var(--line-strong);margin:46px 0 22px;padding-top:20px;gap:18px}
.section-head h2{font:400 clamp(28px,2.7vw,36px)/1.1 var(--display);letter-spacing:-.9px;margin:0}
.section-head p{margin:7px 0 0;color:var(--sub);font-size:13px}
.page-title{font:400 clamp(43px,5vw,67px)/.99 var(--display);letter-spacing:-2px;margin:14px 0 14px}
.subtitle{font-size:14px;color:var(--sub);margin:0 0 25px;line-height:1.6}
.link-btn{border:0;background:transparent;color:var(--purple);padding:8px 0;border-bottom:1px solid var(--purple);white-space:nowrap;font-weight:600;font-size:12px}
.link-btn:hover{color:var(--ink);border-color:var(--ink)}
/* The opening spread is an editorial composition, not a generic landing card. */
.hero{min-height:390px;display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,37%);background:#eef0f1;
 border:1px solid #dbe1e5;position:relative;overflow:hidden;margin-bottom:26px}
.hero:after{content:'N. / READING ROOM';position:absolute;right:20px;top:18px;letter-spacing:2px;font:10px var(--mono);color:#757682}
.hero-copy{z-index:1;padding:clamp(29px,4.5vw,61px) 15px clamp(31px,4.5vw,57px) clamp(28px,4.7vw,64px)}
.hero h1{font:400 clamp(47px,5.7vw,78px)/.99 var(--display);letter-spacing:-2.8px;margin:20px 0 19px;max-width:675px;color:var(--ink)}
.hero h1 em{font-weight:400;font-style:italic;color:var(--purple)}
.hero p{font-size:14px;line-height:1.75;max-width:440px;color:#565664;margin:0 0 26px}
.hero-actions{display:flex;align-items:center;flex-wrap:wrap;gap:11px}
.hero-art{display:flex;align-items:center;justify-content:center;padding:58px 36px 34px 5px;position:relative;min-width:0}
.hero-art:before{content:'';position:absolute;background:#d6c9e4;border-radius:50%;height:260px;width:260px;right:10%;top:18%;opacity:.64}
.hero-art:after{content:'A GOOD BOOK IS ALWAYS A BEGINNING';position:absolute;bottom:21px;right:24px;font:9px var(--mono);letter-spacing:1.2px;color:#6d6a70;white-space:nowrap}
.hero-art .hero-book {position:relative;z-index:1;width:min(78%,235px);transform:rotate(7deg);filter:drop-shadow(10px 21px 12px rgba(39,36,45,.22));border:4px solid #eee7de;background:#fdfbf6;box-shadow:0 3px 0 #9c8f8d;aspect-ratio:2/3;object-fit:cover}
.hero-art .hero-placeholder{position:relative;z-index:1;transform:rotate(7deg);display:grid;place-items:center;width:75%;aspect-ratio:2/3;text-align:center;padding:25px;background:#ddc6b7;color:#463532;font:italic 32px var(--display);box-shadow:15px 23px 25px #41392c33}
.hero-book-credit{position:absolute;z-index:3;left:0;bottom:30px;background:#f8f5f0e8;padding:10px 13px;max-width:175px;line-height:1.25;box-shadow:var(--shadow)}
.hero-book-credit b,.hero-book-credit small{display:block}.hero-book-credit b{font:400 14px var(--display)}.hero-book-credit small{font:9px var(--mono);margin-top:5px;color:#74717a}
.stat-strip{display:flex;align-items:stretch;gap:0;border-block:1px solid var(--line);margin:29px 0 41px}
.stat-strip>div{display:flex;flex:1;min-width:0;gap:12px;align-items:center;padding:15px 25px;border-right:1px solid var(--line)}
.stat-strip>div:first-child{padding-left:0}.stat-strip>div:last-child{border-right:0}
.stat-strip strong{font:400 33px/1 var(--display);color:var(--ink);white-space:nowrap}
.stat-strip span{font-size:11px;color:var(--muted);line-height:1.3;max-width:110px}
.book-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:28px 19px;align-items:start}
.book-card{min-width:0;cursor:pointer;position:relative}
.book-card:focus-visible{outline-offset:5px}
.book-cover{position:relative;aspect-ratio:2/3.04;display:flex;align-items:center;justify-content:center;background:#e2ded8;
 overflow:hidden;border-radius:1px;box-shadow:5px 7px 13px rgba(24,22,27,.13);max-width:240px;transition:transform .19s ease,box-shadow .19s ease}
.book-card:hover .book-cover{transform:translateY(-5px);box-shadow:7px 13px 20px rgba(24,22,27,.17)}
.book-cover img{width:100%;height:100%;object-fit:cover}
.book-cover .placeholder{font:400 22px/1.15 var(--display);color:#5e5864;text-align:center;padding:16px;overflow-wrap:anywhere}
.book-cover .placeholder[hidden]{display:none}
.cover-chip{position:absolute;left:0;bottom:0;background:#f6f3e9ed;color:#473c57;border:0;font:500 8px var(--mono);letter-spacing:.6px;padding:6px 8px}
.card-line{display:flex;align-items:start;gap:5px;margin:13px 0 3px}
.book-card h3{font:600 13px/1.4 var(--body);margin:0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;min-height:18px;letter-spacing:-.15px}
.mini-heart{margin-left:auto;color:var(--copper)}.author{font:12px/1.5 var(--body);color:var(--sub);white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.book-card .rating{font:10px/1.5 var(--mono);color:#756a68;margin-top:8px}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin:23px 0}
.pill{background:transparent;border:1px solid var(--line-strong);border-radius:2px;color:var(--sub);padding:8px 12px;font-size:12px}
.pill.active,.pill:hover{background:var(--lav);border-color:#cfc4e9;color:var(--purple-ink)}
.mood-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mood{background:var(--canvas);border:1px solid var(--line);min-height:120px;text-align:left;padding:18px 20px;display:flex;flex-direction:column;align-items:start;justify-content:space-between}
.mood:nth-child(3n+1){background:#eeeaf2}.mood:nth-child(3n+2){background:#eaf0f2}.mood:nth-child(3n+3){background:#f2eae2}
.mood span{display:none}.mood strong{font:400 26px/1.05 var(--display)}.mood small{color:var(--purple);font-size:11px}.mood:hover{border-color:#9f8dbd}
.filter-bar{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;padding:13px 0;border-block:1px solid var(--line)}
.filter-bar select,.shelf-controls select{background:var(--canvas);border:1px solid var(--line-strong);border-radius:2px;padding:9px 12px;max-width:100%;font-size:12px;color:var(--ink)}
.compact{padding:8px 12px;font-size:12px}
.genre-search{max-width:480px;position:relative;margin:28px 0 19px}.genre-search span{position:absolute;left:13px;top:7px;font-size:23px;color:var(--muted)}
.genre-search input{width:100%;height:47px;background:var(--canvas);border:1px solid var(--line-strong);padding:10px 13px 10px 40px;border-radius:2px;outline:0}
.genre-group{margin:30px 0}.genre-group .section-head{margin:0 0 17px;border-color:var(--line)}
.genre-tags{display:flex;flex-wrap:wrap;gap:8px}
.genre-tags button{background:var(--canvas);border:1px solid var(--line);padding:9px 11px;border-radius:1px;font-size:12px;color:var(--ink);text-align:left}
.genre-tags button:hover{border-color:var(--purple);background:var(--lav)}.genre-tags span{padding-left:10px;color:var(--purple)}
.empty{padding:50px 24px;border:1px dashed var(--line-strong);text-align:center;background:var(--canvas)}
.empty h3{font:400 31px/1.15 var(--display);margin:0 0 12px}.empty p{color:var(--sub)}
.loading{padding:36px 0;text-align:center;font:italic 21px var(--display);color:var(--sub)}
.alert{background:#edeaf3;border-left:2px solid var(--purple);padding:14px 17px;margin:20px 0;font-size:13px;color:var(--purple-ink)}.alert button{margin-left:7px}
.shelf-stats{margin-top:26px}.shelf-grid{margin-top:25px}
.shelf-item{min-width:0}.shelf-controls{display:flex;gap:4px;margin:12px 0;align-items:center}.shelf-controls select{min-width:0;width:100%;font-size:11px;padding:8px}.shelf-controls button{background:transparent;border:1px solid var(--line);padding:7px 10px;color:var(--sub)}
.history-list{border-top:1px solid var(--line);margin-top:28px}
.history-row{border:0;border-bottom:1px solid var(--line);background:none;display:grid;grid-template-columns:46px 1fr auto;gap:15px;align-items:center;width:100%;text-align:left;padding:13px 5px}
.history-row:hover{background:#f0ede9}.history-row>span:first-child{width:39px;height:57px;background:#e4ded8;display:grid;place-items:center;overflow:hidden}.history-row img{height:100%;width:100%;object-fit:cover}
.history-row strong{display:block;font:500 16px var(--display)}.history-row small{color:var(--muted);font-size:11px;display:block}
.detail-back{background:none;border:0;color:var(--purple);padding:0 0 20px;font-size:12px;font-weight:600}
.detail-hero{display:grid;grid-template-columns:minmax(165px,26%) 1fr;gap:clamp(26px,5vw,70px);border-top:1px solid var(--line);padding:30px 0 12px}
.detail-hero>.book-cover{width:100%;max-width:300px;align-self:start}
.detail-info h1{font:400 clamp(39px,4.7vw,67px)/1.03 var(--display);letter-spacing:-2px;margin:16px 0 8px}.byline{color:var(--sub);font-size:17px;margin:0 0 20px}
.meta{display:flex;gap:15px;flex-wrap:wrap;font:10px var(--mono);color:#655d65;padding:16px 0;margin:14px 0;border-block:1px solid var(--line)}
.description{font:400 17px/1.7 var(--display);max-width:730px;white-space:pre-line}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin:23px 0 15px}
.legal{display:block;color:var(--muted);font-size:11px;line-height:1.55;max-width:600px}
.subjects{margin:32px 0}.subjects strong{font:500 11px var(--mono);letter-spacing:.7px}.subjects .pill-row{margin:13px 0}
.review-layout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.review{padding:24px;background:var(--canvas);border:1px solid var(--line);min-width:0}
.review header{display:flex;justify-content:space-between;gap:12px}.review strong{font-size:13px}.review p{font-size:13px;color:var(--sub)}.review textarea,.review select{width:100%;background:white;border:1px solid var(--line-strong);padding:10px;border-radius:2px}
.review-layout>.empty{min-width:0}.review-layout>.loading{grid-column:1/-1}
.overlay{position:fixed;inset:0;background:rgba(27,24,33,.55);z-index:100;display:grid;place-items:center;padding:15px}
.hidden{display:none!important}
.modal{position:relative;background:var(--canvas);width:min(100%,460px);max-height:92vh;overflow:auto;padding:39px clamp(21px,5vw,42px);border:1px solid var(--line);box-shadow:0 30px 90px #201a2940}
.close-modal{position:absolute;right:13px;top:12px;border:0;background:none;color:var(--muted);font-size:28px}
.modal h2{font:400 41px/1 var(--display);letter-spacing:-.9px;margin:13px 0}.modal p{color:var(--sub);font-size:13px}
.auth-tabs{display:flex;border-bottom:1px solid var(--line);margin:25px 0 21px;gap:25px}
.auth-tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 0;color:var(--sub);font-weight:600;font-size:12px}
.auth-tabs button.active{color:var(--purple);border-color:var(--purple)}
.field{margin:15px 0}.field label{display:block;margin-bottom:6px;font-size:12px;font-weight:600}.field input,.field textarea,.field select{width:100%;background:white;border:1px solid var(--line-strong);padding:12px;border-radius:2px;font-size:13px}
.form-msg{font-size:12px!important;color:var(--purple)}.toast{position:fixed;right:20px;bottom:18px;z-index:250;background:#312c3b;color:white;padding:13px 18px;box-shadow:var(--shadow);font-size:12px;max-width:min(92vw,390px)}
.reader{position:fixed;inset:0;z-index:150;background:#f4f0e8;display:flex;flex-direction:column}
.reader-bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;min-height:69px;padding:10px clamp(12px,3.5vw,48px);background:#fbf9f4;border-bottom:1px solid #ddd5c9}
.reader-bar strong{font:400 18px var(--display);margin-right:auto;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reader-bar button,.reader-bar select{background:transparent;border:1px solid #c9bfb2;padding:8px 11px;font-size:12px}
.reader-meter{height:3px;background:#ddd7ca}.reader-meter span{height:100%;display:block;width:0;background:var(--purple)}
.reader-content{flex:1;overflow:auto;padding:clamp(23px,5vw,65px) max(23px,calc((100% - 760px)/2));white-space:pre-wrap;line-height:1.8;font:18px/1.85 Georgia,serif;overflow-wrap:anywhere}
.reader-content.sepia{background:#f6f0e5;color:#342e2a}.reader-content.light{background:#fff;color:#292929}.reader-content.dark{background:#24242b;color:#eee9e6}
body.dark-mode{--paper:#211f25;--canvas:#27252c;--white:#2b2930;--ink:#f0ece8;--sub:#c8c0c6;--muted:#aaa3a9;--line:#454049;--line-strong:#675f67;--lav:#3e394c;--purple:#c0b0ec;--purple-ink:#d8ccf4;--blue:#303843;--accent:#445767;--copper:#dbab82;--shadow:0 13px 33px #0002}
body.dark-mode .sidebar,body.dark-mode .topbar{background:#25232a}
body.dark-mode .hero{background:#30363b;border-color:#47525c}
body.dark-mode .hero h1,body.dark-mode .hero p{color:var(--ink)}
body.dark-mode .hero-art:before{background:#554960}
body.dark-mode .hero-book-credit{background:#35313a;color:#fff}
body.dark-mode .mood{background:#36313c;color:var(--ink)}
body.dark-mode .genre-tags button,body.dark-mode .empty,body.dark-mode .review,body.dark-mode .modal,body.dark-mode .field input,body.dark-mode .field textarea{background:var(--canvas);color:var(--ink)}
body.dark-mode .auth-button,body.dark-mode .primary-btn{background:#6c5d9a;color:#fff}
body.dark-mode .sidebar-tip{background:#38323a;border-color:#504954}
body.dark-mode .sidebar-tip p,body.dark-mode .sidebar-tip span{color:var(--ink)}
body.dark-mode .search-wrap input:focus{background:#34313b}
/* Reader comfort and responsive layouts */

const cache=new Map();const pending=new Map();const TTL=12*60*60*1000;
async function fetchJSON(request,{timeout=11500}={}){
  const cacheKey=KEY+'api:'+request;
  let old=cache.get(request);
  if(!old){old=getLocal('api:'+request,null);if(old)cache.set(request,old)}
  if(old&&Date.now()-old.when<TTL)return old.value;
  if(pending.has(request))return pending.get(request);
  const promise=(async()=>{
    const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),timeout);
    try{
      const r=await fetch(request,{signal:controller.signal,headers:{Accept:'application/json'}});
      if(!r.ok)throw Error('HTTP '+r.status);
      const d=await r.json();const entry={when:Date.now(),value:d};
      cache.set(request,entry);
      // Local storage may reject large responses; the in-memory cache still works.
      if(JSON.stringify(d).length<185000)putLocal('api:'+request,entry);
      return d;
    }catch(e){if(old)return old.value;throw e}
    finally{clearTimeout(timer);pending.delete(request)}
  })();pending.set(request,promise);return promise;
}

function bookDetails(b){const free=b.source==='gutenberg';const keys=Object.keys(b.formats||{});const txt=keys.find(k=>k.startsWith('text/plain')&&!k.includes('zip'));const epub=b.formats?.['application/epub+zip'];const html=keys.find(k=>k.startsWith('text/html')&&!k.includes('zip'));const links=`https://www.amazon.in/s?k=${encodeURIComponent(b.isbn||b.title+' '+b.author)}&i=stripbooks`;
 const dest=free?`https://www.gutenberg.org/ebooks/${encodeURIComponent(b.id)}`:(url(b.preview)||`https://openlibrary.org/works/${encodeURIComponent(b.id)}`);
 return `<button class="detail-back" data-view="explore">← Back to exploring</button><div class="detail-hero">${cover(b)}<div class="detail-info"><div class="intro-label">${free?'FREE PUBLIC-DOMAIN EDITION':'BOOK DETAILS'}</div><h1>${esc(b.title)}</h1><p class="byline">by ${esc(b.author)}</p><div class="meta">${b.year?`<span>${esc(b.year)}</span>`:''}<span>${free?'Free edition available':'Read preview / find edition'}</span><span>${esc(b.source==='gutenberg'?'Project Gutenberg':'Open Library')}</span></div><p class="description">${esc(b.description||'No summary is currently available.')}</p><div class="actions">${free?`<button class="primary-btn" data-read="${esc(id(b))}">Read book →</button>${epub&&url(epub)?`<a class="secondary-btn" href="${esc(url(epub))}" target="_blank" rel="noopener noreferrer">Download EPUB ↓</a>`:''}${txt&&url(b.formats[txt])?`<a class="secondary-btn" href="${esc(url(b.formats[txt]))}" target="_blank" rel="noopener noreferrer">Download TXT ↓</a>`:''}`:`<a class="primary-btn" href="${esc(dest)}" target="_blank" rel="noopener noreferrer">Find a reading edition ↗</a>`}<a class="secondary-btn" href="${esc(links)}" target="_blank" rel="noopener noreferrer">Buy on Amazon ↗</a><button class="secondary-btn" data-save="${esc(id(b))}">♡ Save to shelf</button><button class="secondary-btn" data-share="${esc(id(b))}">↗ Share</button></div><small class="legal">${free?'Public-domain status may vary by country. Check local rights before downloading.':'A full free copy is not guaranteed for copyrighted books. Availability depends on publisher or rights holder.'}</small></div></div><div class="subjects"><strong>Subjects & tags</strong><div class="pill-row">${(b.genres||[]).slice(0,18).map(g=>`<button class="pill" data-genre="${esc(g)}">${esc(g)}</button>`).join('')||'<span class="subtitle">No subject tags available.</span>'}</div></div>${title('More like this','Explore related stories')}<div id="recommendations">${grid([...featured,...classics].filter(x=>id(x)!==id(b)).slice(0,5))}</div>${title('Community reviews','Thoughts from real Novella readers')}<div id="reviews" class="review-layout"><div class="loading">Loading reviews…</div></div>`;
}
async function showBook(k,record=true){let b=matchingBook(k);if(!b){try{b=await hydrate(k)}catch{}}if(!b){const row=[...shelves,...guestShelf,...historyRows,...guestHistory].find(x=>x.book_key===k);if(row)b=remember({...row,id:String(row.book_id),description:'Discover this book and its available editions.',genres:[],formats:{}})}if(!b){$('#main').innerHTML='<div class="alert">This book was not found. Please search again.</div>';return}
 active=b;screen='detail';if(record){const u=new URL(location.href);u.searchParams.delete('view');u.searchParams.set('book',k);history.pushState({},'',u.pathname+u.search)}$('#main').innerHTML=bookDetails(b);window.scrollTo(0,0);track(b,'viewed');loadReviews(b);recommend(b);
 try{const detailed=await hydrate(k);if(active&&id(active)===k&&detailed){active=detailed;$('#main').innerHTML=bookDetails(detailed);loadReviews(detailed);recommend(detailed)}}catch{}
}
async function recommend(b){const node=$('#recommendations');if(!node)return;const tag=(b.genres||[]).find(x=>x.length<40)||'fiction';try{const r=await getOL('subject:"'+tag.replace(/"/g,'')+'"',1,8);if(active&&id(active)===id(b)&&$('#recommendations'))$('#recommendations').innerHTML=grid(r.items.filter(x=>id(x)!==id(b)).slice(0,5))}catch{ /* Existing suggestions remain visible. */ }}
function bookForRow(r){return remember(matchingBook(r.book_key)||{source:r.source,id:r.book_id,title:r.title,author:r.author,cover:r.cover,description:'View this title for available reading options.',genres:[],formats:{}})}
async function track(b,action){if(me&&db){const row={user_id:me.id,book_key:id(b),book_id:String(b.id),source:b.source,title:b.title,author:b.author,cover:b.cover||'',last_action:action,accessed_at:new Date().toISOString()};const {error}=await db.from('reading_history').upsert(row,{onConflict:'user_id,book_key'});if(!error)historyRows=[row,...historyRows.filter(r=>r.book_key!==row.book_key)];}else{const row={...localRow(b),last_action:action,accessed_at:new Date().toISOString()};guestHistory=[row,...guestHistory.filter(r=>r.book_key!==id(b))].slice(0,100);putLocal('guest-history',guestHistory)}}
async function save(b){const row=localRow(b);if(me&&db){const {error}=await db.from('shelves').upsert(row,{onConflict:'user_id,book_key'});if(error)return notify('Could not save: '+error.message);shelves=[row,...shelves.filter(r=>r.book_key!==id(b))]}else{guestShelf=[row,...guestShelf.filter(r=>r.book_key!==id(b))];putLocal('guest-shelf',guestShelf)}notify('Saved to your library ♡')}
async function loadPersonal(){if(!me||!db){shelves=[];historyRows=[];if(['library','history','home'].includes(screen))paint();return}const [s,h]=await Promise.all([db.from('shelves').select('*').eq('user_id',me.id).order('created_at',{ascending:false}).limit(300),db.from('reading_history').select('*').eq('user_id',me.id).order('accessed_at',{ascending:false}).limit(200)]);if(s.error)notify('Library: '+s.error.message);if(h.error)notify('History: '+h.error.message);shelves=s.data||[];historyRows=h.data||[];if(['library','history','home'].includes(screen))paint();}
async function changeStatus(k,value){const shelf=me?shelves:guestShelf;const row=shelf.find(x=>x.book_key===k);if(!row)return;if(me&&db){const {error}=await db.from('shelves').update({status:value}).eq('book_key',k).eq('user_id',me.id);if(error)return notify(error.message)}row.status=value;if(!me)putLocal('guest-shelf',guestShelf);notify('Reading status updated');if(value==='read')track(bookForRow(row),'read');paint();}
async function removeShelf(k){if(me&&db){const {error}=await db.from('shelves').delete().eq('book_key',k).eq('user_id',me.id);if(error)return notify(error.message);shelves=shelves.filter(r=>r.book_key!==k)}else{guestShelf=guestShelf.filter(r=>r.book_key!==k);putLocal('guest-shelf',guestShelf)}paint();notify('Removed from your library')}
async function loadReviews(b){const holder=$('#reviews');if(!holder)return;if(!db){holder.innerHTML='<div class="alert">Community reviews are available when Supabase is connected. You can still browse and save books as a guest.</div>';return}
 const {data,error}=await db.from('reviews').select('id,user_id,display_name,rating,body,created_at').eq('book_key',id(b)).order('created_at',{ascending:false}).limit(40);if(!active||id(active)!==id(b)||!$('#reviews'))return;
 const rows=data||[];const avg=rows.length?(rows.reduce((sum,r)=>sum+r.rating,0)/rows.length).toFixed(1):null;
 holder.innerHTML=(error?`<div class="alert">${esc(error.message)}</div>`:'')+`<div class="review"><strong>${avg?'★ '+avg+' / 5 · '+rows.length+' community reviews':'Be the first to review'}</strong><p>Share a thoughtful, spoiler-conscious review.</p>${me?`<form id="review-form"><div class="field"><label for="review-rating">Your rating</label><select id="review-rating" name="rating">${[5,4,3,2,1].map(n=>`<option value="${n}">${'★'.repeat(n)} · ${n}/5</option>`).join('')}</select></div><div class="field"><label for="review-body">Your review</label><textarea id="review-body" name="body" minlength="5" maxlength="1200" rows="3" required placeholder="What did you think?"></textarea></div><button class="primary-btn">Publish review</button><p class="form-msg" id="review-message"></p></form>`:'<button class="secondary-btn" data-auth="signin">Sign in to review</button>'}</div>`+(rows.length?rows.map(r=>`<div class="review"><header><strong>${esc(r.display_name||'Reader')}</strong><span class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span></header><p>${esc(r.body)}</p><small>${new Date(r.created_at).toLocaleDateString()}</small>${me?.id===r.user_id?` <button class="link-btn" data-delete-review="${esc(r.id)}">Delete</button>`:''}</div>`).join(''):'<div class="empty">No reviews yet. Start the conversation!</div>');
 if($('#review-form'))$('#review-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const {error:err}=await db.from('reviews').upsert({user_id:me.id,book_key:id(b),display_name:(me.user_metadata?.name||me.email?.split('@')[0]||'Reader').slice(0,50),rating:Number(f.get('rating')),body:String(f.get('body')).trim()},{onConflict:'user_id,book_key'});if(err)$('#review-message').textContent=err.message;else{notify('Review published!');loadReviews(b)}};
}
function readerModal(b){const keys=Object.keys(b.formats||{});const k=keys.find(x=>x.startsWith('text/plain')&&!x.includes('zip'));const html=keys.find(x=>x.startsWith('text/html')&&!x.includes('zip'));const external=`https://www.gutenberg.org/ebooks/${encodeURIComponent(b.id)}`;
 const panel=document.createElement('div');panel.className='reader';panel.innerHTML=`<div class="reader-bar"><button id="reader-close">← Back</button><strong>${esc(b.title)}</strong><select id="reader-theme" aria-label="Reader theme"><option value="sepia">Warm paper</option><option value="light">Light</option><option value="dark">Dark</option></select><button id="font-down" aria-label="Smaller text">A−</button><button id="font-up" aria-label="Larger text">A+</button><button id="reader-done">Finished ✓</button></div><div class="reader-meter"><span id="reader-meter-fill"></span></div><article class="reader-content sepia" id="reader-text">Loading full text…</article>`;document.body.append(panel);const close=()=>{panel.remove();document.removeEventListener('keydown',onKey)};const onKey=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',onKey);$('#reader-close').onclick=close;$('#reader-theme').onchange=e=>{$('#reader-text').className='reader-content '+e.target.value};let size=18;const res=n=>{$('#reader-text').style.fontSize=(size=Math.min(28,Math.max(13,size+n)))+'px'};$('#font-up').onclick=()=>res(1);$('#font-down').onclick=()=>res(-1);
 $('#reader-done').onclick=async()=>{if(!(me?shelves:guestShelf).some(r=>r.book_key===id(b)))await save(b);await changeStatus(id(b),'read');notify('Marked as finished!')};
 const text=$('#reader-text');text.onscroll=()=>{const fraction=text.scrollTop/Math.max(1,text.scrollHeight-text.clientHeight);$('#reader-meter-fill').style.width=Math.round(fraction*100)+'%';try{localStorage.setItem(KEY+'progress:'+id(b),String(fraction))}catch{}};
 const t=k?url(b.formats[k]):null;if(!t){text.innerHTML=`<div class="empty"><h3>Read the original edition</h3><p>This edition is hosted by Project Gutenberg. Open the authorized book page to read it.</p><a class="primary-btn" href="${esc(html?url(b.formats[html])||external:external)}" target="_blank" rel="noopener noreferrer">Open official book ↗</a></div>`;return}
 fetch(t).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.text()}).then(s=>{if(!panel.isConnected)return;text.textContent=s.slice(0,3000000);const saved=Number(localStorage.getItem(KEY+'progress:'+id(b))||0);text.scrollTop=saved*Math.max(0,text.scrollHeight-text.clientHeight)}).catch(()=>{if(panel.isConnected)text.innerHTML=`<div class="empty"><h3>Read the original edition</h3><p>The publisher's server did not allow an embedded reader.</p><a class="primary-btn" href="${esc(external)}" target="_blank" rel="noopener noreferrer">Open Gutenberg ↗</a></div>`});track(b,'reading');
}
function openAuth(mode='signin'){authMode=mode;$('#modal-overlay').classList.remove('hidden');authPaint()}
function authPaint(){const root=$('#modal-body');const account=authMode==='account';root.innerHTML=`<span class="intro-label">YOUR NEXT CHAPTER STARTS HERE</span><h2 id="modal-heading">${account?'Your account':authMode==='signup'?'Join the book club':authMode==='forgot'?'Reset your password':authMode==='new-password'?'Set a new password':'Welcome back'}</h2><p>${account?'Make your reading space yours.':authMode==='signup'?'A personalized reading life begins here.':authMode==='forgot'?'We will email you a password reset link.':authMode==='new-password'?'Choose a new password to continue.':'Sign in to sync your shelf and your stories.'}</p>${!db?'<div class="alert">Accounts are not connected yet. Add your Supabase publishable key in config.js. Your guest library still works.</div>':''}${account?`<p><strong>${esc(me?.email||'')}</strong></p><div class="field"><label for="profile-name">Display name</label><input id="profile-name" maxlength="50" value="${esc(me?.user_metadata?.name||'')}"></div><button class="primary-btn" id="save-profile">Save name</button> <button class="secondary-btn" id="signout">Sign out</button><button class="link-btn" id="open-password">Change password</button><p id="auth-msg" class="form-msg"></p>`:authMode==='new-password'?`<form id="auth-form"><div class="field"><label>New password</label><input type="password" name="password" minlength="8" required autocomplete="new-password"></div><button class="primary-btn">Update password</button><p id="auth-msg" class="form-msg"></p></form>`:authMode==='forgot'?`<form id="auth-form"><div class="field"><label>Email address</label><input type="email" name="email" required autocomplete="email"></div><button class="primary-btn">Send reset email</button><button type="button" class="link-btn" data-auth="signin">Back to sign in</button><p id="auth-msg" class="form-msg"></p></form>`:`<div class="auth-tabs"><button class="${authMode==='signin'?'active':''}" data-auth="signin">Sign in</button><button class="${authMode==='signup'?'active':''}" data-auth="signup">Register</button></div><form id="auth-form">${authMode==='signup'?'<div class="field"><label>Display name</label><input name="name" maxlength="50" autocomplete="name" required placeholder="What should we call you?"></div>':''}<div class="field"><label>Email address</label><input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field"><label>Password</label><input name="password" type="password" minlength="8" autocomplete="${authMode==='signup'?'new-password':'current-password'}" required placeholder="At least 8 characters"></div><button class="primary-btn" style="width:100%">${authMode==='signup'?'Create account':'Sign in'} →</button>${authMode==='signin'?'<button type="button" class="link-btn" data-auth="forgot">Forgot password?</button>':''}<p id="auth-msg" class="form-msg"></p></form>`}`;if($('#auth-form'))$('#auth-form').onsubmit=authSubmit;
 if($('#signout'))$('#signout').onclick=async()=>{await db.auth.signOut();closeAuth();notify('Signed out')};if($('#save-profile'))$('#save-profile').onclick=async()=>{const {error}=await db.auth.updateUser({data:{name:$('#profile-name').value.trim().slice(0,50)}});$('#auth-msg').textContent=error?.message||'Name updated';};if($('#open-password'))$('#open-password').onclick=()=>openAuth('new-password');}
function closeAuth(){$('#modal-overlay').classList.add('hidden')}
async function authSubmit(e){e.preventDefault();const msg=$('#auth-msg');if(!db){msg.textContent='Connect Supabase first in config.js.';return}const btn=e.currentTarget.querySelector('button[type=submit],button.primary-btn');btn.disabled=true;msg.textContent='Please wait…';const form=new FormData(e.currentTarget);const email=String(form.get('email')||'').trim(),password=String(form.get('password')||'');try{
 let r;if(authMode==='signup')r=await db.auth.signUp({email,password,options:{data:{name:String(form.get('name')||'').trim()},emailRedirectTo:location.origin+location.pathname}});
 else if(authMode==='forgot')r=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
 else if(authMode==='new-password')r=await db.auth.updateUser({password});
 else r=await db.auth.signInWithPassword({email,password});
 if(r.error)throw r.error;msg.style.color='#43876b';msg.textContent=authMode==='signup'?'Check your inbox to confirm your account.':authMode==='forgot'?'If the email is registered, check your inbox.':authMode==='new-password'?'Password updated!':'Signed in successfully.';
 if(authMode==='signin'||authMode==='new-password'){setTimeout(()=>{closeAuth();if(authMode==='new-password')history.replaceState({},'',location.pathname)},900)}
 }catch(err){msg.style.color='#bb5371';msg.textContent=err.message||'Could not complete that request.'}finally{btn.disabled=false}}
function userUI(){const name=me?(me.user_metadata?.name||me.email?.split('@')[0]||'Reader'):'Guest reader';$('#side-name').textContent=name;$('#side-status').textContent=me?'Account synced':'Local reading space';$('.avatar').textContent=name.slice(0,1).toUpperCase();$('#auth-button').textContent=me?'My account ↗':'Sign in →';}
async function initAuth(){if(!db){userUI();return}try{const {data}=await db.auth.getSession();me=data?.session?.user||null;userUI();await loadPersonal();db.auth.onAuthStateChange((event,session)=>{me=session?.user||null;userUI();if(event==='PASSWORD_RECOVERY'){recoveryMode=true;openAuth('new-password')}else if(event==='SIGNED_IN'||event==='SIGNED_OUT'){setTimeout(loadPersonal,0)}});if(location.hash.includes('type=recovery')){recoveryMode=true;openAuth('new-password')}}catch(e){notify('Account connection could not be verified.')}}
// Event delegation: works for freshly-rendered pages and saved cards.
document.addEventListener('click',async e=>{
 const t=e.target.closest('button,a,[data-book]');if(!t)return;
 if(t.dataset.auth){openAuth(t.dataset.auth);return}
 if(t.dataset.shelfTab){shelfFilter=t.dataset.shelfTab;paint();return}
 if(t.dataset.save){e.stopPropagation();const b=matchingBook(t.dataset.save);if(b)save(b);return}
 if(t.dataset.book){$('#suggestions').classList.add('hidden');await showBook(t.dataset.book);return}
 if(t.dataset.view){navigate(t.dataset.view);if(t.dataset.view==='explore'&&!results.length)browse('','',1);return}
 if(t.dataset.genre!==undefined){source='all';sort='relevance';$('#global-search').value='';browse('',t.dataset.genre,1);return}
 if(t.dataset.read){let b=matchingBook(t.dataset.read);if(b){try{b=await hydrate(id(b))}catch{}readerModal(b)}return}
 if(t.dataset.share){const link=new URL(location.href);link.searchParams.set('book',t.dataset.share);try{await navigator.clipboard.writeText(link.href);notify('Book link copied!')}catch{notify('Copy the link from your address bar to share.')}return}
 if(t.dataset.remove){removeShelf(t.dataset.remove);return}
 if(t.dataset.deleteReview&&me&&db){if(!confirm('Delete your review?'))return;const {error}=await db.from('reviews').delete().eq('id',t.dataset.deleteReview).eq('user_id',me.id);notify(error?error.message:'Review deleted');if(active)loadReviews(active);return}
 if(t.id==='load-more'){browse(searchText,selectedGenre,page+1);return}
 if(t.id==='clear-guest'){if(!confirm('Clear your guest reading shelf and history on this device?'))return;guestShelf=[];guestHistory=[];putLocal('guest-shelf',[]);putLocal('guest-history',[]);notify('Guest data cleared');return}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.status)changeStatus(t.dataset.status,t.value);if(t.id==='source-filter'){source=t.value;browse(searchText,selectedGenre,1)}if(t.id==='sort-filter'){sort=t.value;paint()}});
document.addEventListener('input',e=>{if(e.target.id==='global-search'){renderSearchSuggestions(e.target.value)}if(e.target.id==='genre-search'){const groups=$('#genre-groups');if(groups)groups.innerHTML=genreGroups(e.target.value)}});
document.addEventListener('keydown',e=>{const b=e.target.closest('[data-book]');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();b.click()}if(e.key==='Escape'){closeAuth();$('.sidebar').classList.remove('open')}});
function renderSearchSuggestions(text){const panel=$('#suggestions');const val=text.trim().toLowerCase();if(val.length<2){panel.classList.add('hidden');return}
 const possible=[...new Map([...seed,...featured,...classics,...results].map(b=>[id(b),b])).values()];const chosen=possible.filter(b=>(b.title+' '+b.author).toLowerCase().includes(val)).slice(0,5);
 panel.innerHTML=`<div class="suggest-head">FROM THE READING ROOM</div>`+chosen.map(b=>`<button data-book="${esc(id(b))}" type="button"><span>${esc(b.title)}</span><small>${esc(b.author)}</small></button>`).join('')+`<button class="all-results" type="button" id="suggest-all">Search all titles for “${esc(text)}” ↗</button>`;
 panel.classList.remove('hidden');
}
$('#global-search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#suggestions').classList.add('hidden');source='all';browse(e.target.value,'',1)}});
document.addEventListener('click',e=>{if(e.target.closest('#suggest-all')){const value=$('#global-search').value;$('#suggestions').classList.add('hidden');browse(value,'',1)}else if(!e.target.closest('.search-wrap'))$('#suggestions').classList.add('hidden')});
$('#auth-button').onclick=()=>openAuth(me?'account':'signin');$('#side-account').onclick=()=>openAuth(me?'account':'signin');
$('#close-modal').onclick=closeAuth;$('#modal-overlay').onclick=e=>{if(e.target.id==='modal-overlay')closeAuth()};
$('#menu-btn').onclick=()=>$('.sidebar').classList.toggle('open');
$('#theme-btn').onclick=()=>{userTheme=userTheme==='dark'?'light':'dark';putLocal('theme',userTheme);document.body.classList.toggle('dark-mode',userTheme==='dark');$('#theme-btn').textContent=userTheme==='dark'?'☀':'☾'};
$('#surprise-btn').onclick=()=>{const arr=[...featured,...classics,...seed];if(arr.length)showBook(id(arr[Math.floor(Math.random()*arr.length)]))};
$('#footer-privacy').onclick=()=>navigate('info');
$('#brand').onclick=e=>{e.preventDefault();navigate('home')};
window.addEventListener('popstate',()=>{const u=new URL(location.href);const b=u.searchParams.get('book');if(b&&/^(gutenberg|openlibrary|google):[a-zA-Z0-9_-]+$/.test(b))showBook(b,false);else navigate(['explore','genres','library','history','info'].includes(u.searchParams.get('view'))?u.searchParams.get('view'):'home',false)});
const start=new URL(location.href);const route=start.searchParams.get('view');screen=['explore','genres','library','history','info'].includes(route)?route:'home';
document.body.classList.toggle('dark-mode',userTheme==='dark');$('#theme-btn').textContent=userTheme==='dark'?'☀':'☾';
paint();initCatalog();initAuth();const book=start.searchParams.get('book');if(book&&/^(gutenberg|openlibrary|google):[a-zA-Z0-9_-]+$/.test(book))setTimeout(()=>showBook(book,false),250);

  </script>
